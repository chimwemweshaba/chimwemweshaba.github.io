<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIE Pseudocode - Level 2: Variables & Assignment Mastery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #111827;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .home-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: background 0.2s;
    }
    .home-link:hover {
      background: #263449;
    }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
    .logo span { color: #38bdf8; }
    .level-badge {
      background: #0284c7;
      color: white;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 6px;
    }
    .stats { display: flex; gap: 14px; font-size: 14px; }
    .pill { background: #1e293b; padding: 6px 14px; border-radius: 40px; border: 1px solid #334155; }
    .pill b { color: #facc15; }

    .app-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      background: #0f172a;
      border-right: 1px solid #1e293b;
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar h3 { font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; margin-bottom: 10px; padding-left: 4px; }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 5px;
      transition: 0.2s;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 12.5px;
      background: #1e293b;
      color: #cbd5e1;
    }
    .step-item:hover { background: #263449; }
    .step-item.active { background: #0c4a6e; border-color: #38bdf8; color: #38bdf8; }
    .step-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #334155; color: #94a3b8; }
    .step-item.active .tag { background: #0284c7; color: #fff; }

    .main-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: #0f172a;
      display: flex;
      flex-direction: column;
    }

    .mission { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 14px; }
    .mission h1 { font-size: 22px; font-weight: 700; color: #f8fafc; }
    .mission p { color: #94a3b8; font-size: 13.5px; margin-top: 4px; }
    .badge { background: #0284c7; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }

    .objective { margin-bottom: 18px; padding: 12px 16px; border-left: 4px solid #38bdf8; background: #0b1220; border-radius: 8px; font-size: 13.5px; color: #cbd5e1; }
    .objective b { color: #f8fafc; }

    /* MCQ View Styles */
    .mcq-container {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      max-width: 820px;
    }
    .mcq-code {
      background: #020617;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      color: #bae6fd;
      font-family: 'Consolas', monospace;
      font-size: 14px;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .predict-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .predict-options button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-family: 'Consolas', monospace;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13.5px;
    }
    .predict-options button:hover:not(:disabled) { background: #263449; border-color: #38bdf8; }
    .predict-options button.correct { background: #14532d !important; border-color: #22c55e !important; color: #bbf7d0; }
    .predict-options button.wrong { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fecaca; }
    .predict-options button:disabled { opacity: 0.8; cursor: default; }

    /* Coding Workspace Styles */
    .workspace { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; flex: 1; }
    .box { background: #111827; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .boxhead { padding: 10px 14px; background: #172033; font-weight: 700; font-size: 13px; color: #94a3b8; border-bottom: 1px solid #334155; }
    .boxbody { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    pre.spec { margin: 0; white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 13.5px; line-height: 1.6; color: #bae6fd; }
    textarea { width: 100%; height: 240px; resize: none; background: #020617; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 14px/1.6 'Consolas', monospace; outline: none; }
    textarea:focus { border-color: #38bdf8; }
    .output-display { width: 100%; height: 240px; background: #020617; color: #4ade80; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 14px/1.6 'Consolas', monospace; overflow-y: auto; white-space: pre-wrap; }
    .output-display.error-text { color: #f87171; }

    .buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button.action { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; font-size: 13px; background: #0284c7; color: white; transition: 0.2s; }
    button.action:hover { filter: brightness(1.1); }
    button.action.secondary { background: #334155; }
    button.action.hint { background: #b45309; }
    button.action.next { background: #166534; }

    .feedback { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; font-size: 13.5px; line-height: 1.45; }
    .feedback.success { display: block; background: #052e1b; border: 1px solid #166534; color: #bbf7d0; }
    .feedback.error { display: block; background: #3b0a0a; border: 1px solid #991b1b; color: #fecaca; }
    .feedback.info { display: block; background: #172033; border: 1px solid #475569; color: #cbd5e1; }

    @media(max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
      .app-wrapper { flex-direction: column; }
      .sidebar { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="home-link">← Home</a>
    <div class="logo">
      <span class="level-badge">Level 2</span>
      📝 CIE Pseudocode Quest <span>(Variables & Assignment)</span>
    </div>
  </div>
  <div class="stats">
    <div class="pill">Progress: <b id="progressStat">1/11</b></div>
    <div class="pill">⭐ <b id="scoreStat">0</b></div>
  </div>
</header>

<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-title">📌 LEVEL 2: Variables & Assignment</div>
    <div id="activityList"></div>
  </aside>

  <main class="main-area">
    <div class="mission">
      <div>
        <h1 id="actTitle">Activity Title</h1>
        <p id="actDesc">Activity description goes here.</p>
      </div>
      <div class="badge" id="actType">Quiz</div>
    </div>

    <div class="objective">
      <b>🎯 Objective:</b> <span id="actObj">Goal description...</span>
    </div>

    <div id="viewContainer"></div>

    <div id="feedback" class="feedback"></div>
  </main>
</div>

<script>
  const activities = [
    // ==========================================
    // MODULE A: VARIABLE ASSIGNMENT MCQs
    // ==========================================
    {
      id: 1,
      section: "Variable Assignment MCQs",
      type: "MCQ",
      title: "VAR MCQ 1: Assignment Operator",
      desc: "Identify the correct CIE assignment operator.",
      objective: "Recognize standard CIE pseudocode syntax for assigning a value to a variable.",
      code: '// Which statement correctly assigns the value 10 to a variable named Score?',
      options: [
        'Score <- 10',
        'Score = 10',
        'Score := 10',
        '10 -> Score'
      ],
      correct: 0,
      explain: 'In CIE Pseudocode, the assignment operator is the left-pointing arrow "<-". Equal signs (=) are reserved for comparison operators in IF/WHILE statements.',
      hint: 'CIE uses a left arrow pointing from the value on the right to the variable on the left.'
    },
    {
      id: 2,
      section: "Variable Assignment MCQs",
      type: "MCQ",
      title: "VAR MCQ 2: Identifier vs String Literal",
      desc: "Identify invalid variable syntax containing quotes.",
      objective: "Understand why quotes must NOT be placed around variable identifiers during assignment.",
      code: '"Num" <- 4',
      options: [
        'Valid: Assigns 4 to the variable Num',
        'Invalid: Quoted "Num" is a string literal, not a variable identifier',
        'Valid: Strings can be used as variable names in CIE pseudocode',
        'Invalid: The number 4 must be written in quotes as "4"'
      ],
      correct: 1,
      explain: 'Wrapping "Num" in double quotes makes it a String Literal. Values can only be assigned to valid variable identifiers (e.g., Num <- 4), never to literals.',
      hint: 'Variable identifiers must be plain unquoted names. Anything in quotes is literal text.'
    },
    {
      id: 3,
      section: "Variable Assignment MCQs",
      type: "MCQ",
      title: "VAR MCQ 3: Direction of Assignment",
      desc: "Identify the correct direction of data flow in assignment.",
      objective: "Verify that the variable identifier must always be on the left side of the assignment operator.",
      code: 'Line 1: Age <- 15\nLine 2: 15 <- Age',
      options: [
        'Line 1 is VALID; Line 2 is INVALID',
        'Line 1 is INVALID; Line 2 is VALID',
        'Both Line 1 and Line 2 are VALID',
        'Both Line 1 and Line 2 are INVALID'
      ],
      correct: 0,
      explain: 'Assignment ALWAYS flows from right to left (Variable <- Expression). The destination variable identifier must strictly sit on the left-hand side of "<-".',
      hint: 'The left arrow points TO the target variable on the left.'
    },
    {
      id: 4,
      section: "Variable Assignment MCQs",
      type: "MCQ",
      title: "VAR MCQ 4: Variable Declaration Syntax",
      desc: "Identify formal variable declaration in CIE pseudocode.",
      objective: "Recognize the DECLARE keyword and data type binding.",
      code: '// Which statement correctly declares an integer variable in CIE pseudocode?',
      options: [
        'DECLARE Count : INTEGER',
        'VAR Count AS INTEGER',
        'INTEGER Count',
        'DECLARE Count = INTEGER'
      ],
      correct: 0,
      explain: 'CIE standard syntax mandates explicit declarations using: DECLARE <identifier> : <data_type>.',
      hint: 'Look for the DECLARE keyword followed by a colon and the standard uppercase data type.'
    },
    {
      id: 5,
      section: "Variable Assignment MCQs",
      type: "MCQ",
      title: "VAR MCQ 5: Expression Assignment & Variable Tracing",
      desc: "Trace variable updates and expressions.",
      objective: "Determine the final value stored in a variable after calculation.",
      code: 'DECLARE Total : INTEGER\nTotal <- 5\nTotal <- Total + 3\nOUTPUT Total',
      options: [
        '8',
        '53',
        '5',
        'Error: Total cannot equal Total + 3'
      ],
      correct: 0,
      explain: 'Total starts at 5. Total <- Total + 3 evaluates 5 + 3 = 8, then assigns 8 back into Total. OUTPUT Total prints 8.',
      hint: 'Evaluate the right-hand side first (5 + 3), then update the variable on the left.'
    },

    // ==========================================
    // MODULE B: CODING CHALLENGES
    // ==========================================
    {
      id: 6,
      section: "Assignment Challenges",
      type: "Code",
      title: "Challenge 1: Declare & Assign",
      desc: "Declare an integer variable and assign it a value.",
      objective: "Declare an INTEGER variable named 'Score' and assign it the value 100.",
      challenge: "Write pseudocode to:\n1. Declare a variable named 'Score' as an INTEGER.\n2. Assign the value 100 to 'Score'.\n3. Output the variable 'Score'.",
      need: ["DECLARE", "Score", "INTEGER", "<-", "100", "OUTPUT"],
      hint: "Use syntax: DECLARE Score : INTEGER\nScore <- 100\nOUTPUT Score",
      sampleOutput: "100"
    },
    {
      id: 7,
      section: "Assignment Challenges",
      type: "Code",
      title: "Challenge 2: Variable to Variable Assignment",
      desc: "Copy a value from one variable to another.",
      objective: "Copy the value stored in Num1 into Num2.",
      challenge: "Write pseudocode to:\n1. Declare two INTEGER variables: 'Num1' and 'Num2'.\n2. Assign 25 to 'Num1'.\n3. Copy the value of 'Num1' into 'Num2'.\n4. Output 'Num2'.",
      need: ["DECLARE", "Num1", "Num2", "INTEGER", "Num1 <- 25", "Num2 <- Num1", "OUTPUT Num2"],
      hint: "Assign 25 to Num1 first. Then set Num2 <- Num1 before printing Num2.",
      sampleOutput: "25"
    },
    {
      id: 8,
      section: "Assignment Challenges",
      type: "Code",
      title: "Challenge 3: Calculating & Updating Variables",
      desc: "Perform arithmetic during assignment.",
      objective: "Calculate a price with tax and display the updated price.",
      challenge: "Write pseudocode to:\n1. Declare 'Price' as REAL.\n2. Assign 50.0 to 'Price'.\n3. Increase 'Price' by adding 5.0 to itself.\n4. Output 'Price'.",
      need: ["DECLARE", "Price", "REAL", "50.0", "Price <- Price + 5.0", "OUTPUT Price"],
      hint: "Use Price <- Price + 5.0 to add to the existing value.",
      sampleOutput: "55.0"
    },
    {
      id: 9,
      section: "Assignment Challenges",
      type: "Code",
      title: "Challenge 4: Outputting Variable with Label",
      desc: "Combine variables and string literals in output.",
      objective: "Assign a variable and output it alongside a string literal label.",
      challenge: "Assume 'PlayerName' is already declared.\n\nWrite pseudocode to:\n1. Assign \"Alex\" to 'PlayerName'.\n2. Output the literal \"Player: \" followed by the variable 'PlayerName'.",
      need: ["PlayerName <- \"Alex\"", "OUTPUT", "\"Player: \"", "PlayerName"],
      hint: "Assign with PlayerName <- \"Alex\". Then use OUTPUT \"Player: \", PlayerName",
      sampleOutput: "Player: Alex"
    },
    {
      id: 10,
      section: "Assignment Challenges",
      type: "Code",
      title: "Challenge 5: Combining Multiple Literals & Variables",
      desc: "Assign a value and output multiple string literals alongside a variable.",
      objective: "Assign a variable and combine it with leading and trailing string literals in a single OUTPUT statement.",
      challenge: "Assume 'Points' is already declared.\n\nWrite pseudocode to:\n1. Assign the value 50 to the variable 'Points'\n2. Output the string literal \"Current Score: \"\n3. Output the variable 'Points'\n4. Output the string literal \" pts\"\n\n(Write this using a single OUTPUT statement).",
      need: ["Points <- 50", "OUTPUT", "\"Current Score: \"", "Points", "\" pts\""],
      hint: "First assign with Points <- 50, then separate literals and variables with commas in one statement: OUTPUT \"Current Score: \", Points, \" pts\"",
      sampleOutput: "Current Score: 50 pts"
    },
    {
      id: 11,
      section: "Assignment Challenges",
      type: "Code",
      title: "Challenge 6: Outputting Variable Inside a Sentence Structure",
      desc: "Embed variables between surrounding text literals.",
      objective: "Format a output statement placing variable values inside descriptive text.",
      challenge: "Assume 'Hours' is already declared and assigned the value 8.\n\nWrite pseudocode to:\n1. Output: \"You have worked \" followed by the variable 'Hours' and then \" hours today.\"",
      need: ["OUTPUT", "\"You have worked \"", "Hours", "\" hours today.\""],
      hint: "Structure it like: OUTPUT \"You have worked \", Hours, \" hours today.\"",
      sampleOutput: "You have worked 8 hours today."
    }
  ];

  let currentIdx = 0;
  let score = 0;
  let mcqChosen = -1;

  function renderSidebar() {
    const listEl = document.getElementById("activityList");
    listEl.innerHTML = "";
    
    let currentSec = "";
    activities.forEach((act, idx) => {
      if (act.section !== currentSec) {
        currentSec = act.section;
        const h = document.createElement("h3");
        h.textContent = currentSec;
        h.style.marginTop = idx > 0 ? "14px" : "0px";
        listEl.appendChild(h);
      }

      const btn = document.createElement("div");
      btn.className = `step-item ${idx === currentIdx ? 'active' : ''}`;
      btn.innerHTML = `
        <span>${idx + 1}. ${act.title.split(':')[0]}</span>
        <span class="tag">${act.type}</span>
      `;
      btn.onclick = () => loadActivity(idx);
      listEl.appendChild(btn);
    });
    
    document.getElementById("progressStat").textContent = `${currentIdx + 1}/${activities.length}`;
    document.getElementById("scoreStat").textContent = score;
  }

  function loadActivity(idx) {
    currentIdx = idx;
    mcqChosen = -1;
    const act = activities[idx];

    document.getElementById("actTitle").textContent = act.title;
    document.getElementById("actDesc").textContent = act.desc;
    document.getElementById("actType").textContent = act.type === "MCQ" ? "Multiple Choice" : "Coding Challenge";
    document.getElementById("actObj").textContent = act.objective;

    hideFeedback();
    renderSidebar();

    const container = document.getElementById("viewContainer");
    if (act.type === "MCQ") {
      renderMCQView(container, act);
    } else {
      renderCodeView(container, act);
    }
  }

  function renderMCQView(container, act) {
    let html = `
      <div class="mcq-container">
        <div class="mcq-code">${act.code}</div>
        <div class="predict-options" id="mcqOptions">
    `;
    act.options.forEach((opt, idx) => {
      html += `<button data-idx="${idx}" onclick="handleMCQSelect(${idx})">${opt}</button>`;
    });
    html += `
        </div>
        <div class="buttons">
          <button class="action secondary" onclick="prevActivity()">⏮ Previous Activity</button>
          <button class="action hint" onclick="showHint()">💡 Hint</button>
          <button class="action next" onclick="nextActivity()">⏭ Next Activity</button>
        </div>
      </div>
    `;
    container.innerHTML = html;
  }

  function handleMCQSelect(idx) {
    const act = activities[currentIdx];
    if (mcqChosen !== -1) return;
    mcqChosen = idx;

    const btns = document.querySelectorAll("#mcqOptions button");
    btns.forEach((btn, bIdx) => {
      btn.disabled = true;
      if (bIdx === act.correct) {
        btn.classList.add("correct");
      } else if (bIdx === idx) {
        btn.classList.add("wrong");
      }
    });

    if (idx === act.correct) {
      score += 100;
      showFeedback("success", `✅ <b>Correct!</b> ${act.explain}`);
    } else {
      showFeedback("error", `❌ <b>Incorrect.</b> ${act.explain}`);
    }
    renderSidebar();
  }

  function renderCodeView(container, act) {
    container.innerHTML = `
      <div class="workspace">
        <div class="box">
          <div class="boxhead">📋 Challenge Specification</div>
          <div class="boxbody"><pre class="spec">${act.challenge}</pre></div>
        </div>
        <div class="box">
          <div class="boxhead">⌨️ Your Level 2 Pseudocode Solution</div>
          <div class="boxbody">
            <textarea id="codeEditor" placeholder="Type your CIE Pseudocode here..." spellcheck="false"></textarea>
            <div class="buttons">
              <button class="action" onclick="checkCodeAnswer()">▶ Run & Check</button>
              <button class="action secondary" onclick="resetCodeEditor()">↻ Clear</button>
              <button class="action secondary" onclick="prevActivity()">⏮ Previous Activity</button>
              <button class="action hint" onclick="showHint()">💡 Hint</button>
              <button class="action next" onclick="nextActivity()">⏭ Next Activity</button>
            </div>
          </div>
        </div>
        <div class="box">
          <div class="boxhead">🖥️ Program Output</div>
          <div class="boxbody">
            <div id="outputDisplay" class="output-display">Press "Run & Check" to execute...</div>
          </div>
        </div>
      </div>
    `;
  }

  function checkCodeAnswer() {
    const act = activities[currentIdx];
    const editor = document.getElementById("codeEditor");
    const outEl = document.getElementById("outputDisplay");
    const codeRaw = editor.value.trim();
    const codeUpper = codeRaw.toUpperCase();

    if (!codeRaw) {
      outEl.classList.add("error-text");
      outEl.textContent = "SyntaxError: No pseudocode entered.\nExecution halted.";
      showFeedback("error", "❌ Please write your solution before running.");
      return;
    }

    // Checking for syntax mistakes like "VarName" <- Value
    if (/\"[A-Za-z0-9_]+\"\s*<-/.test(codeRaw)) {
      outEl.classList.add("error-text");
      outEl.textContent = "SyntaxError: Cannot assign a value to a string literal in double quotes.";
      showFeedback("error", "❌ Invalid variable syntax! Do not put variable names in double quotes.");
      return;
    }

    const missing = act.need.filter(kw => !codeUpper.includes(kw.toUpperCase()));

    if (missing.length > 0) {
      outEl.classList.add("error-text");
      outEl.textContent = `SyntaxError: Pseudocode non-compliant with requirements.\nMissing expected term(s): ${missing.join(", ")}`;
      showFeedback("error", `❌ Non-compliant syntax. Missing: <b>${missing.join(", ")}</b>`);
    } else {
      outEl.classList.remove("error-text");
      outEl.textContent = act.sampleOutput;
      score += 100;
      showFeedback("success", `✅ <b>Correct CIE Pseudocode!</b> +100 points. Variable & string literal combination verified!`);
    }
    renderSidebar();
  }

  function resetCodeEditor() {
    const editor = document.getElementById("codeEditor");
    const outEl = document.getElementById("outputDisplay");
    if (editor) editor.value = "";
    if (outEl) {
      outEl.classList.remove("error-text");
      outEl.textContent = 'Press "Run & Check" to execute...';
    }
    hideFeedback();
  }

  function showHint() {
    const act = activities[currentIdx];
    showFeedback("info", `💡 <b>Hint:</b> ${act.hint}`);
  }

  function prevActivity() {
    if (currentIdx > 0) {
      loadActivity(currentIdx - 1);
    } else {
      showFeedback("info", "ℹ️ <b>First Activity!</b> You are already at the beginning of Level 2.");
    }
  }

  function nextActivity() {
    if (currentIdx < activities.length - 1) {
      loadActivity(currentIdx + 1);
    } else {
      showFeedback("info", "🎉 <b>Level 2 Complete!</b> You have mastered CIE Variable Declaration, Assignment, and Formatting Output! Return to Home to start Level 3.");
    }
  }

  function showFeedback(type, message) {
    const fb = document.getElementById("feedback");
    fb.className = `feedback ${type}`;
    fb.innerHTML = message;
  }

  function hideFeedback() {
    const fb = document.getElementById("feedback");
    fb.className = "feedback";
    fb.innerHTML = "";
  }

  // Initial load
  loadActivity(0);
</script>
</body>
</html>
