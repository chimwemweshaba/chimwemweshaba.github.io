<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIE Pseudocode Quest - Level 4: Built-in Functions & Routines</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #111827;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .home-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: background 0.2s;
    }
    .home-link:hover {
      background: #263449;
    }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
    .logo span { color: #38bdf8; }
    .level-badge {
      background: #0284c7;
      color: white;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 6px;
    }
    .stats { display: flex; gap: 14px; font-size: 14px; }
    .pill { background: #1e293b; padding: 6px 14px; border-radius: 40px; border: 1px solid #334155; }
    .pill b { color: #facc15; }

    .app-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 330px;
      background: #0f172a;
      border-right: 1px solid #1e293b;
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar h3 { font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; margin-bottom: 10px; padding-left: 4px; }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 5px;
      transition: 0.2s;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 12.5px;
      background: #1e293b;
      color: #cbd5e1;
    }
    .step-item:hover { background: #263449; }
    .step-item.active { background: #0c4a6e; border-color: #38bdf8; color: #38bdf8; }
    .step-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #334155; color: #94a3b8; }
    .step-item.active .tag { background: #0284c7; color: #fff; }

    .main-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: #0f172a;
      display: flex;
      flex-direction: column;
    }

    .mission { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 14px; }
    .mission h1 { font-size: 22px; font-weight: 700; color: #f8fafc; }
    .mission p { color: #94a3b8; font-size: 13.5px; margin-top: 4px; }
    .badge { background: #0284c7; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }

    .objective { margin-bottom: 18px; padding: 12px 16px; border-left: 4px solid #38bdf8; background: #0b1220; border-radius: 8px; font-size: 13.5px; color: #cbd5e1; }
    .objective b { color: #f8fafc; }

    /* MCQ View Styles */
    .mcq-container {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      max-width: 820px;
    }
    .mcq-code {
      background: #020617;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      color: #bae6fd;
      font-family: 'Consolas', monospace;
      font-size: 14px;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .predict-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .predict-options button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-family: 'Consolas', monospace;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13.5px;
    }
    .predict-options button:hover:not(:disabled) { background: #263449; border-color: #38bdf8; }
    .predict-options button.correct { background: #14532d !important; border-color: #22c55e !important; color: #bbf7d0; }
    .predict-options button.wrong { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fecaca; }
    .predict-options button:disabled { opacity: 0.8; cursor: default; }

    /* Coding Workspace Styles */
    .workspace { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; flex: 1; }
    .box { background: #111827; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .boxhead { padding: 10px 14px; background: #172033; font-weight: 700; font-size: 13px; color: #94a3b8; border-bottom: 1px solid #334155; }
    .boxbody { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    pre.spec { margin: 0; white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 13.5px; line-height: 1.6; color: #bae6fd; }
    textarea { width: 100%; height: 250px; resize: none; background: #020617; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 14px/1.6 'Consolas', monospace; outline: none; }
    textarea:focus { border-color: #38bdf8; }
    .output-display { width: 100%; height: 250px; background: #020617; color: #4ade80; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 14px/1.6 'Consolas', monospace; overflow-y: auto; white-space: pre-wrap; }
    .output-display.error-text { color: #f87171; }

    .buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button.action { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; font-size: 13px; background: #0284c7; color: white; transition: 0.2s; }
    button.action:hover { filter: brightness(1.1); }
    button.action.secondary { background: #334155; }
    button.action.hint { background: #b45309; }
    button.action.next { background: #166534; }

    .feedback { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; font-size: 13.5px; line-height: 1.45; }
    .feedback.success { display: block; background: #052e1b; border: 1px solid #166534; color: #bbf7d0; }
    .feedback.error { display: block; background: #3b0a0a; border: 1px solid #991b1b; color: #fecaca; }
    .feedback.info { display: block; background: #172033; border: 1px solid #475569; color: #cbd5e1; }

    @media(max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
      .app-wrapper { flex-direction: column; }
      .sidebar { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="home-link">← Home</a>
    <div class="logo">
      <span class="level-badge">Level 4</span>
      ⚙️ CIE Pseudocode Quest <span>(Built-in Functions & Routines)</span>
    </div>
  </div>
  <div class="stats">
    <div class="pill">Progress: <b id="progressStat">1/15</b></div>
    <div class="pill">⭐ <b id="scoreStat">0</b></div>
  </div>
</header>

<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-title">📌 LEVEL 4: Built-in Functions</div>
    <div id="activityList"></div>
  </aside>

  <main class="main-area">
    <div class="mission">
      <div>
        <h1 id="actTitle">Activity Title</h1>
        <p id="actDesc">Activity description goes here.</p>
      </div>
      <div class="badge" id="actType">Quiz</div>
    </div>

    <div class="objective">
      <b>🎯 Objective:</b> <span id="actObj">Goal description...</span>
    </div>

    <div id="viewContainer"></div>

    <div id="feedback" class="feedback"></div>
  </main>
</div>

<script>
  const activities = [
    // ==========================================
    // MODULE A: BUILT-IN FUNCTIONS MCQs
    // ==========================================
    {
      id: 1,
      section: "Functions MCQs",
      type: "MCQ",
      title: "FUNCTIONS MCQ 1: SUBSTRING Parameters",
      desc: "Understand parameter indexing for SUBSTRING functions.",
      objective: "Identify the correct 1-based indexing output for SUBSTRING(string, start, length).",
      code: 'DECLARE Text : STRING\nText <- "Computer Science"\nOUTPUT SUBSTRING(Text, 10, 7)',
      options: [
        'Science',
        'Scienc',
        'uter Sc',
        'Science '
      ],
      correct: 0,
      explain: 'In CIE Pseudocode, indexing starts at 1. Position 10 is "S". Extracting 7 characters starting from index 10 returns "Science".',
      hint: 'Count starting from index 1 for "C". Index 10 is "S", and taking 7 characters gives "Science".'
    },
    {
      id: 2,
      section: "Functions MCQs",
      type: "MCQ",
      title: "FUNCTIONS MCQ 2: RANDOM Range",
      desc: "Identify the value range returned by RANDOM().",
      objective: "Recognize that RANDOM() returns a real value between 0 and 1 inclusive.",
      code: 'DECLARE Value : REAL\nValue <- RANDOM()',
      options: [
        'Generates an integer between 1 and 100',
        'Generates a REAL number between 0 and 1 inclusive',
        'Generates a REAL number between -1 and 1',
        'Generates an integer between 0 and 10'
      ],
      correct: 1,
      explain: 'As defined in the CIE syllabus, RANDOM() returns a pseudo-random REAL number between 0 and 1 inclusive (e.g., 0.0 to 1.0).',
      hint: 'RANDOM() produces decimal values bounded by 0 and 1.'
    },
    {
      id: 3,
      section: "Functions MCQs",
      type: "MCQ",
      title: "FUNCTIONS MCQ 3: Case Conversion",
      desc: "Predict the effect of applying UCASE and LCASE.",
      objective: "Determine how non-alphabetic characters behave under case functions.",
      code: 'DECLARE Code : STRING\nCode <- "Cie-2026!"\nOUTPUT UCASE(Code)',
      options: [
        'CIE-2026!',
        'CIE2026!',
        'cie-2026!',
        'ERROR: Numbers cannot be converted'
      ],
      correct: 0,
      explain: 'UCASE converts all lowercase alphabetic characters to uppercase while leaving numbers, hyphens, and symbols untouched.',
      hint: 'Only letters change to uppercase; symbols and digits remain unchanged.'
    },
    {
      id: 4,
      section: "Functions MCQs",
      type: "MCQ",
      title: "FUNCTIONS MCQ 4: ROUND Precision",
      desc: "Evaluate the output of the ROUND library routine.",
      objective: "Understand how ROUND(Value, Places) rounds real values.",
      code: 'DECLARE Value : REAL\nValue <- 14.856\nOUTPUT ROUND(Value, 2)',
      options: [
        '14.85',
        '14.86',
        '14.8',
        '15.00'
      ],
      correct: 1,
      explain: 'ROUND(14.856, 2) rounds the value to 2 decimal places. The third decimal (6) rounds the second decimal (5) up to 6, giving 14.86.',
      hint: 'Look at the 3rd decimal digit to see whether to round up or down.'
    },
    {
      id: 5,
      section: "Functions MCQs",
      type: "MCQ",
      title: "FUNCTIONS MCQ 5: DIV and MOD Routines",
      desc: "Differentiate between integer division and modulo routines.",
      objective: "Recognize the difference between quotient DIV and remainder MOD.",
      code: 'DECLARE X : INTEGER\nDECLARE Y : INTEGER\nX <- DIV(17, 5)\nY <- MOD(17, 5)\nOUTPUT X, " ", Y',
      options: [
        '3.4  2',
        '3  2',
        '2  3',
        '3.4  0.4'
      ],
      correct: 1,
      explain: 'DIV(17, 5) calculates integer quotient (17 ÷ 5 = 3 with remainder 2). MOD(17, 5) returns remainder 2. Thus, X is 3 and Y is 2.',
      hint: 'DIV yields whole quotient, MOD yields whole remainder.'
    },

    // ==========================================
    // MODULE B: BUILT-IN FUNCTIONS CODING CHALLENGES
    // ==========================================
    {
      id: 6,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 1: String Length Check",
      desc: "Calculate string length using LENGTH().",
      objective: "Input a password string, measure its length with LENGTH(), and store the integer in PassLength.",
      challenge: "Assume 'Password' is STRING and 'PassLength' is INTEGER.\n\nWrite pseudocode to:\n1. Input 'Password'\n2. Store its length in 'PassLength' using LENGTH()\n3. Output 'PassLength'",
      need: ["INPUT Password", "PassLength <-", "LENGTH(Password)", "OUTPUT PassLength"],
      hint: "Use syntax: PassLength <- LENGTH(Password)"
    },
    {
      id: 7,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 2: Uppercase Normalization",
      desc: "Convert user input string to uppercase.",
      objective: "Input a user's code string, convert it to uppercase using UCASE(), and store in UpperCode.",
      challenge: "Assume 'UserCode' and 'UpperCode' are STRING.\n\nWrite pseudocode to:\n1. Input 'UserCode'\n2. Convert 'UserCode' to uppercase using UCASE() and store in 'UpperCode'\n3. Output 'UpperCode'",
      need: ["INPUT UserCode", "UpperCode <-", "UCASE(UserCode)", "OUTPUT UpperCode"],
      hint: "Use syntax: UpperCode <- UCASE(UserCode)"
    },
    {
      id: 8,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 3: Lowercase Normalization",
      desc: "Convert user input string to lowercase.",
      objective: "Input an email address, convert it to lowercase using LCASE(), and display it.",
      challenge: "Assume 'Email' and 'CleanEmail' are STRING.\n\nWrite pseudocode to:\n1. Input 'Email'\n2. Convert 'Email' to lowercase using LCASE() and store in 'CleanEmail'\n3. Output 'CleanEmail'",
      need: ["INPUT Email", "CleanEmail <-", "LCASE(Email)", "OUTPUT CleanEmail"],
      hint: "Use syntax: CleanEmail <- LCASE(Email)"
    },
    {
      id: 9,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 4: Substring Extraction (Initials)",
      desc: "Extract a single character from a string using SUBSTRING().",
      objective: "Extract the first character of Name using SUBSTRING() with length 1.",
      challenge: "Assume 'Name' and 'Initial' are STRING.\n\nWrite pseudocode to:\n1. Input 'Name'\n2. Extract the 1st character from 'Name' using SUBSTRING() and store in 'Initial'\n3. Output 'Initial'",
      need: ["INPUT Name", "Initial <-", "SUBSTRING(Name, 1, 1)", "OUTPUT Initial"],
      hint: "SUBSTRING takes parameters (string, start, length): SUBSTRING(Name, 1, 1)"
    },
    {
      id: 10,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 5: Extract Domain Prefix",
      desc: "Extract specific multi-character section of a string.",
      objective: "Extract the first 3 characters of ProductCode using SUBSTRING().",
      challenge: "Assume 'ProductCode' and 'Prefix' are STRING.\n\nWrite pseudocode to:\n1. Input 'ProductCode'\n2. Extract the first 3 characters from 'ProductCode' and store in 'Prefix'\n3. Output 'Prefix'",
      need: ["INPUT ProductCode", "Prefix <-", "SUBSTRING(ProductCode, 1, 3)", "OUTPUT Prefix"],
      hint: "Extract 3 chars starting at index 1: SUBSTRING(ProductCode, 1, 3)"
    },
    {
      id: 11,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 6: Rounding Currency",
      desc: "Round a floating-point number to 2 decimal places.",
      objective: "Round a REAL variable RawPrice to 2 decimal places using ROUND().",
      challenge: "Assume 'RawPrice' and 'FinalPrice' are REAL.\n\nWrite pseudocode to:\n1. Input 'RawPrice'\n2. Round 'RawPrice' to 2 decimal places using ROUND() and store in 'FinalPrice'\n3. Output 'FinalPrice'",
      need: ["INPUT RawPrice", "FinalPrice <-", "ROUND(RawPrice, 2)", "OUTPUT FinalPrice"],
      hint: "Use syntax: FinalPrice <- ROUND(RawPrice, 2)"
    },
    {
      id: 12,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 7: Random Integer Generator (1 to 6)",
      desc: "Scale RANDOM() to generate a dice roll value from 1 to 6.",
      objective: "Combine RANDOM() and ROUND() to produce an integer between 1 and 6.",
      challenge: "Assume 'DiceRoll' is INTEGER.\n\nWrite pseudocode to:\n1. Generate a whole number between 1 and 6 using ROUND((RANDOM() * 5) + 1, 0)\n2. Store in 'DiceRoll'\n3. Output 'DiceRoll'",
      need: ["DiceRoll <-", "ROUND(", "RANDOM()", "OUTPUT DiceRoll"],
      hint: "Store expression in DiceRoll: DiceRoll <- ROUND((RANDOM() * 5) + 1, 0)"
    },
    {
      id: 13,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 8: Integer Division (DIV)",
      desc: "Calculate quotient without fractional parts using DIV.",
      objective: "Determine how many full 6-pack boxes are needed for TotalItems using DIV().",
      challenge: "Assume 'TotalItems' and 'FullBoxes' are INTEGER.\n\nWrite pseudocode to:\n1. Input 'TotalItems'\n2. Calculate full boxes using DIV(TotalItems, 6) and store in 'FullBoxes'\n3. Output 'FullBoxes'",
      need: ["INPUT TotalItems", "FullBoxes <-", "DIV(TotalItems, 6)", "OUTPUT FullBoxes"],
      hint: "DIV syntax: FullBoxes <- DIV(TotalItems, 6)"
    },
    {
      id: 14,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 9: Modulo Remainder (MOD)",
      desc: "Calculate remainder using MOD.",
      objective: "Determine remaining loose items left over after forming 6-pack boxes using MOD().",
      challenge: "Assume 'TotalItems' and 'Leftovers' are INTEGER.\n\nWrite pseudocode to:\n1. Input 'TotalItems'\n2. Calculate remaining items using MOD(TotalItems, 6) and store in 'Leftovers'\n3. Output 'Leftovers'",
      need: ["INPUT TotalItems", "Leftovers <-", "MOD(TotalItems, 6)", "OUTPUT Leftovers"],
      hint: "MOD syntax: Leftovers <- MOD(TotalItems, 6)"
    },
    {
      id: 15,
      section: "Function Challenges",
      type: "Code",
      title: "Challenge 10: Compound Username Generator",
      desc: "Combine UCASE, SUBSTRING, and LENGTH into a single workflow.",
      objective: "Generate a formatted username using string length, substring extraction, and upper-case conversion.",
      challenge: "Assume 'FirstName' and 'LastName' are STRING, and 'Code' is STRING.\n\nWrite pseudocode to:\n1. Input 'FirstName'\n2. Input 'LastName'\n3. Create 'Code' by joining UCASE(SUBSTRING(FirstName, 1, 1)) and UCASE(LastName)\n4. Output 'Code'",
      need: ["INPUT FirstName", "INPUT LastName", "Code <-", "UCASE(", "SUBSTRING(FirstName, 1, 1)", "OUTPUT Code"],
      hint: "Combine functions: Code <- UCASE(SUBSTRING(FirstName, 1, 1)) & UCASE(LastName)"
    }
  ];

  let currentIdx = 0;
  let score = 0;
  let mcqChosen = -1;

  function renderSidebar() {
    const listEl = document.getElementById("activityList");
    listEl.innerHTML = "";
    
    let currentSec = "";
    activities.forEach((act, idx) => {
      if (act.section !== currentSec) {
        currentSec = act.section;
        const h = document.createElement("h3");
        h.textContent = currentSec;
        h.style.marginTop = idx > 0 ? "14px" : "0px";
        listEl.appendChild(h);
      }

      const btn = document.createElement("div");
      btn.className = `step-item ${idx === currentIdx ? 'active' : ''}`;
      btn.innerHTML = `
        <span>${idx + 1}. ${act.title.split(':')[0]}</span>
        <span class="tag">${act.type}</span>
      `;
      btn.onclick = () => loadActivity(idx);
      listEl.appendChild(btn);
    });
    
    document.getElementById("progressStat").textContent = `${currentIdx + 1}/${activities.length}`;
    document.getElementById("scoreStat").textContent = score;
  }

  function loadActivity(idx) {
    currentIdx = idx;
    mcqChosen = -1;
    const act = activities[idx];

    document.getElementById("actTitle").textContent = act.title;
    document.getElementById("actDesc").textContent = act.desc;
    document.getElementById("actType").textContent = act.type === "MCQ" ? "Multiple Choice" : "Coding Challenge";
    document.getElementById("actObj").textContent = act.objective;

    hideFeedback();
    renderSidebar();

    const container = document.getElementById("viewContainer");
    if (act.type === "MCQ") {
      renderMCQView(container, act);
    } else {
      renderCodeView(container, act);
    }
  }

  function renderMCQView(container, act) {
    let html = `
      <div class="mcq-container">
        <div class="mcq-code">${act.code}</div>
        <div class="predict-options" id="mcqOptions">
    `;
    act.options.forEach((opt, idx) => {
      html += `<button data-idx="${idx}" onclick="handleMCQSelect(${idx})">${opt}</button>`;
    });
    html += `
        </div>
        <div class="buttons">
          <button class="action secondary" onclick="prevActivity()">⏮ Previous Activity</button>
          <button class="action hint" onclick="showHint()">💡 Hint</button>
          <button class="action next" onclick="nextActivity()">⏭ Next Activity</button>
        </div>
      </div>
    `;
    container.innerHTML = html;
  }

  function handleMCQSelect(idx) {
    const act = activities[currentIdx];
    if (mcqChosen !== -1) return;
    mcqChosen = idx;

    const btns = document.querySelectorAll("#mcqOptions button");
    btns.forEach((btn, bIdx) => {
      btn.disabled = true;
      if (bIdx === act.correct) {
        btn.classList.add("correct");
      } else if (bIdx === idx) {
        btn.classList.add("wrong");
      }
    });

    if (idx === act.correct) {
      score += 100;
      showFeedback("success", `✅ <b>Correct!</b> ${act.explain}`);
    } else {
      showFeedback("error", `❌ <b>Incorrect.</b> ${act.explain}`);
    }
    renderSidebar();
  }

  function renderCodeView(container, act) {
    container.innerHTML = `
      <div class="workspace">
        <div class="box">
          <div class="boxhead">📋 Challenge Specification</div>
          <div class="boxbody"><pre class="spec">${act.challenge}</pre></div>
        </div>
        <div class="box">
          <div class="boxhead">⌨️ Your Level 4 Pseudocode Solution</div>
          <div class="boxbody">
            <textarea id="codeEditor" placeholder="Type your CIE Pseudocode here..." spellcheck="false"></textarea>
            <div class="buttons">
              <button class="action" onclick="runInteractiveCode()">▶ Run & Check</button>
              <button class="action secondary" onclick="resetCodeEditor()">↻ Clear</button>
              <button class="action secondary" onclick="prevActivity()">⏮ Previous Activity</button>
              <button class="action hint" onclick="showHint()">💡 Hint</button>
              <button class="action next" onclick="nextActivity()">⏭ Next Activity</button>
            </div>
          </div>
        </div>
        <div class="box">
          <div class="boxhead">🖥️ Program Output</div>
          <div class="boxbody">
            <div id="outputDisplay" class="output-display">Press "Run & Check" to execute...</div>
          </div>
        </div>
      </div>
    `;
  }

  function runInteractiveCode() {
    const act = activities[currentIdx];
    const editor = document.getElementById("codeEditor");
    const outEl = document.getElementById("outputDisplay");
    const codeRaw = editor.value.trim();
    const codeUpper = codeRaw.toUpperCase();

    outEl.classList.remove("error-text");
    outEl.textContent = "";

    if (!codeRaw) {
      outEl.classList.add("error-text");
      outEl.textContent = "SyntaxError: No pseudocode entered.\nExecution halted.";
      showFeedback("error", "❌ Please write your solution before running.");
      return;
    }

    // Check required keywords compliance
    const missing = act.need.filter(kw => !codeUpper.includes(kw.toUpperCase()));
    if (missing.length > 0) {
      outEl.classList.add("error-text");
      outEl.textContent = `SyntaxError: Pseudocode non-compliant with standard.\nMissing required element(s): ${missing.join(", ")}`;
      showFeedback("error", `❌ Syntax non-compliant. Missing expected element: <b>${missing.join(", ")}</b>`);
      return;
    }

    // Interactive Interpreter Environment with CIE Functions Pre-bound
    const lines = codeRaw.split('\n');
    const env = {};
    let logs = [];

    // Helper JavaScript function wrappers matching CIE specification (1-based indexing)
    const LENGTH = (str) => String(str).length;
    const UCASE = (str) => String(str).toUpperCase();
    const LCASE = (str) => String(str).toLowerCase();
    const SUBSTRING = (str, start, len) => String(str).substr(start - 1, len);
    const ROUND = (val, places) => Number(Math.round(val + "e" + places) + "e-" + places);
    const RANDOM = () => Math.random();
    const DIV = (a, b) => Math.floor(a / b);
    const MOD = (a, b) => a % b;

    for (let line of lines) {
      let cleanLine = line.trim();
      if (!cleanLine || cleanLine.startsWith("//")) continue;

      // DECLARE
      if (cleanLine.toUpperCase().startsWith("DECLARE")) {
        const match = cleanLine.match(/DECLARE\s+([A-Za-z0-9_]+)\s*:\s*(STRING|INTEGER|REAL|CHAR|BOOLEAN)/i);
        if (match) {
          env[match[1]] = match[2].toUpperCase() === "STRING" ? "" : 0;
        }
        continue;
      }

      // INPUT
      if (cleanLine.toUpperCase().startsWith("INPUT")) {
        const varName = cleanLine.replace(/INPUT/i, "").trim();
        const userVal = prompt(`INPUT REQUIRED:\nEnter value for variable [${varName}]:`);
        
        if (userVal === null) {
          outEl.classList.add("error-text");
          outEl.textContent = "Execution cancelled by user.";
          showFeedback("error", "❌ Input step was cancelled.");
          return;
        }

        if (!isNaN(userVal) && userVal.trim() !== "") {
          env[varName] = Number(userVal);
        } else {
          env[varName] = userVal;
        }
        logs.push(`[INPUT ${varName}: ${userVal}]`);
        continue;
      }

      // ASSIGNMENT (<-)
      if (cleanLine.includes("<-")) {
        const parts = cleanLine.split("<-");
        const varName = parts[0].trim();
        let expr = parts[1].trim();

        // Convert CIE string concatenation operator (&) to JavaScript operator (+)
        expr = expr.replace(/&/g, "+");

        // Substitute current scope variables
        Object.keys(env).forEach(key => {
          const regex = new RegExp(`\\b${key}\\b`, 'g');
          const val = typeof env[key] === 'string' ? `"${env[key]}"` : env[key];
          expr = expr.replace(regex, val);
        });

        try {
          // Evaluate in environment scope containing CIE functions
          const evalFunc = new Function('LENGTH', 'UCASE', 'LCASE', 'SUBSTRING', 'ROUND', 'RANDOM', 'DIV', 'MOD', `return ${expr};`);
          env[varName] = evalFunc(LENGTH, UCASE, LCASE, SUBSTRING, ROUND, RANDOM, DIV, MOD);
        } catch (err) {
          outEl.classList.add("error-text");
          outEl.textContent = `Runtime Error in statement: ${cleanLine}\n${err.message}`;
          showFeedback("error", "❌ Evaluation error in calculation/function call statement.");
          return;
        }
        continue;
      }

      // OUTPUT
      if (cleanLine.toUpperCase().startsWith("OUTPUT")) {
        let rawArg = cleanLine.replace(/OUTPUT/i, "").trim();
        const args = rawArg.split(",").map(a => a.trim());
        
        const printedValues = args.map(arg => {
          if (arg.startsWith('"') && arg.endsWith('"')) {
            return arg.slice(1, -1);
          }
          if (env[arg] !== undefined) {
            return env[arg];
          }
          try {
            const evalFunc = new Function('LENGTH', 'UCASE', 'LCASE', 'SUBSTRING', 'ROUND', 'RANDOM', 'DIV', 'MOD', `return ${arg};`);
            return evalFunc(LENGTH, UCASE, LCASE, SUBSTRING, ROUND, RANDOM, DIV, MOD);
          } catch(e) {
            return arg;
          }
        });

        logs.push(printedValues.join(""));
        continue;
      }
    }

    outEl.textContent = logs.join("\n");
    score += 100;
    showFeedback("success", "✅ <b>Success!</b> Code executed live with CIE library routines!");
    renderSidebar();
  }

  function resetCodeEditor() {
    const editor = document.getElementById("codeEditor");
    const outEl = document.getElementById("outputDisplay");
    if (editor) editor.value = "";
    if (outEl) {
      outEl.classList.remove("error-text");
      outEl.textContent = 'Press "Run & Check" to execute...';
    }
    hideFeedback();
  }

  function showHint() {
    const act = activities[currentIdx];
    showFeedback("info", `💡 <b>Hint:</b> ${act.hint}`);
  }

  function prevActivity() {
    if (currentIdx > 0) {
      loadActivity(currentIdx - 1);
    } else {
      showFeedback("info", "ℹ️ <b>First Activity!</b> You are already at the beginning of Level 4.");
    }
  }

  function nextActivity() {
    if (currentIdx < activities.length - 1) {
      loadActivity(currentIdx + 1);
    } else {
      showFeedback("info", "🎉 <b>Level Complete!</b> You have mastered CIE Built-in Functions & Library Routines!");
    }
  }

  function showFeedback(type, message) {
    const fb = document.getElementById("feedback");
    fb.className = `feedback ${type}`;
    fb.innerHTML = message;
  }

  function hideFeedback() {
    const fb = document.getElementById("feedback");
    fb.className = "feedback";
    fb.innerHTML = "";
  }

  loadActivity(0);
</script>
</body>
</html>
