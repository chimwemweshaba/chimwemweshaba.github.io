<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIE Pseudocode Quest - Level 3: User Input</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #111827;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .home-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: background 0.2s;
    }
    .home-link:hover {
      background: #263449;
    }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
    .logo span { color: #38bdf8; }
    .level-badge {
      background: #0284c7;
      color: white;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 6px;
    }
    .stats { display: flex; gap: 14px; font-size: 14px; }
    .pill { background: #1e293b; padding: 6px 14px; border-radius: 40px; border: 1px solid #334155; }
    .pill b { color: #facc15; }

    .app-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 330px;
      background: #0f172a;
      border-right: 1px solid #1e293b;
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar h3 { font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; margin-bottom: 10px; padding-left: 4px; }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 5px;
      transition: 0.2s;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 12.5px;
      background: #1e293b;
      color: #cbd5e1;
    }
    .step-item:hover { background: #263449; }
    .step-item.active { background: #0c4a6e; border-color: #38bdf8; color: #38bdf8; }
    .step-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #334155; color: #94a3b8; }
    .step-item.active .tag { background: #0284c7; color: #fff; }

    .main-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: #0f172a;
      display: flex;
      flex-direction: column;
    }

    .mission { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 14px; }
    .mission h1 { font-size: 22px; font-weight: 700; color: #f8fafc; }
    .mission p { color: #94a3b8; font-size: 13.5px; margin-top: 4px; }
    .badge { background: #0284c7; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }

    .objective { margin-bottom: 18px; padding: 12px 16px; border-left: 4px solid #38bdf8; background: #0b1220; border-radius: 8px; font-size: 13.5px; color: #cbd5e1; }
    .objective b { color: #f8fafc; }

    /* MCQ View Styles */
    .mcq-container {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      max-width: 820px;
    }
    .mcq-code {
      background: #020617;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      color: #bae6fd;
      font-family: 'Consolas', monospace;
      font-size: 14px;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .predict-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .predict-options button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-family: 'Consolas', monospace;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13.5px;
    }
    .predict-options button:hover:not(:disabled) { background: #263449; border-color: #38bdf8; }
    .predict-options button.correct { background: #14532d !important; border-color: #22c55e !important; color: #bbf7d0; }
    .predict-options button.wrong { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fecaca; }
    .predict-options button:disabled { opacity: 0.8; cursor: default; }

    /* Coding Workspace Styles */
    .workspace { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; flex: 1; }
    .box { background: #111827; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .boxhead { padding: 10px 14px; background: #172033; font-weight: 700; font-size: 13px; color: #94a3b8; border-bottom: 1px solid #334155; }
    .boxbody { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    pre.spec { margin: 0; white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 13.5px; line-height: 1.6; color: #bae6fd; }
    textarea { width: 100%; height: 240px; resize: none; background: #020617; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 14px/1.6 'Consolas', monospace; outline: none; }
    textarea:focus { border-color: #38bdf8; }
    .output-display { width: 100%; height: 240px; background: #020617; color: #4ade80; border: 1px solid #475569; border-radius: 8px; padding: 12px; font: 14px/1.6 'Consolas', monospace; overflow-y: auto; white-space: pre-wrap; }
    .output-display.error-text { color: #f87171; }

    .buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button.action { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; font-size: 13px; background: #0284c7; color: white; transition: 0.2s; }
    button.action:hover { filter: brightness(1.1); }
    button.action.secondary { background: #334155; }
    button.action.hint { background: #b45309; }
    button.action.next { background: #166534; }

    .feedback { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; font-size: 13.5px; line-height: 1.45; }
    .feedback.success { display: block; background: #052e1b; border: 1px solid #166534; color: #bbf7d0; }
    .feedback.error { display: block; background: #3b0a0a; border: 1px solid #991b1b; color: #fecaca; }
    .feedback.info { display: block; background: #172033; border: 1px solid #475569; color: #cbd5e1; }

    @media(max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
      .app-wrapper { flex-direction: column; }
      .sidebar { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="home-link">← Home</a>
    <div class="logo">
      <span class="level-badge">Level 3</span>
      📝 CIE Pseudocode Quest <span>(User Input)</span>
    </div>
  </div>
  <div class="stats">
    <div class="pill">Progress: <b id="progressStat">1/15</b></div>
    <div class="pill">⭐ <b id="scoreStat">0</b></div>
  </div>
</header>

<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-title">📌 LEVEL 3: User Input</div>
    <div id="activityList"></div>
  </aside>

  <main class="main-area">
    <div class="mission">
      <div>
        <h1 id="actTitle">Activity Title</h1>
        <p id="actDesc">Activity description goes here.</p>
      </div>
      <div class="badge" id="actType">Quiz</div>
    </div>

    <div class="objective">
      <b>🎯 Objective:</b> <span id="actObj">Goal description...</span>
    </div>

    <div id="viewContainer"></div>

    <div id="feedback" class="feedback"></div>
  </main>
</div>

<script>
  const activities = [
    // ==========================================
    // MODULE A: USER INPUT MCQs
    // ==========================================
    {
      id: 1,
      section: "User Input MCQs",
      type: "MCQ",
      title: "INPUT MCQ 1: Basic Input Syntax",
      desc: "Identify the standard CIE statement for getting user input.",
      objective: "Recognize the correct keyword used to store user keyboard input into a variable.",
      code: '// Which standard CIE pseudocode line correctly prompts user entry into a variable named Age?',
      options: [
        'INPUT Age',
        'READ "Age"',
        'GET Age',
        'INPUT "Enter Age"'
      ],
      correct: 0,
      explain: 'In CIE pseudocode, user entry is captured using the keyword INPUT followed directly by an unquoted variable name (e.g., INPUT Age). Prompts inside INPUT commands are not supported; separate OUTPUT prompts are required.',
      hint: 'CIE uses upper-case INPUT followed by the exact variable identifier without quotes.'
    },
    {
      id: 2,
      section: "User Input MCQs",
      type: "MCQ",
      title: "INPUT MCQ 2: User Prompts",
      desc: "Identify the standard pattern for requesting input with instructions.",
      objective: "Understand how to properly pair an output prompt with an input command.",
      code: '// How should you ask a user for their name in CIE pseudocode?',
      options: [
        'OUTPUT "Enter name: "\nINPUT Name',
        'INPUT "Enter name: ", Name',
        'READ Name("Enter name: ")',
        'Name <- INPUT("Enter name: ")'
      ],
      correct: 0,
      explain: 'CIE Pseudocode requires two distinct steps: first use OUTPUT to display the instructions/prompt to the user, then use INPUT to receive the user data into the target variable.',
      hint: 'First display text with OUTPUT, then take input with INPUT on a separate line.'
    },
    {
      id: 3,
      section: "User Input MCQs",
      type: "MCQ",
      title: "INPUT MCQ 3: Common Syntax Errors",
      desc: "Identify common mistakes made when writing INPUT statements.",
      objective: "Distinguish valid variable arguments from invalid string literals in INPUT statements.",
      code: 'INPUT "UserName"',
      options: [
        'Valid: Captures user input into UserName',
        'Invalid: Quotes turn "UserName" into a string literal; INPUT requires a variable identifier',
        'Valid: Strings inside INPUT statements set the input field placeholder',
        'Invalid: INPUT must always be written in lowercase (input)'
      ],
      correct: 1,
      explain: 'You cannot place quotes around the target variable in an INPUT statement. "UserName" is evaluated as text rather than a variable container.',
      hint: 'The argument after INPUT must be a variable name, never wrapped in quotes.'
    },
    {
      id: 4,
      section: "User Input MCQs",
      type: "MCQ",
      title: "INPUT MCQ 4: Input & Variable Types",
      desc: "Determine data types required for numeric calculations after input.",
      objective: "Understand data type compatibility when accepting numeric inputs for calculations.",
      code: 'DECLARE Price : REAL\nDECLARE Quantity : INTEGER\nINPUT Price\nINPUT Quantity\nTotal <- Price * Quantity',
      options: [
        'Valid: Real numbers can be multiplied by integers in CIE pseudocode',
        'Invalid: Quantity must be declared as REAL to perform multiplication',
        'Invalid: INPUT automatically converts all input values to STRING',
        'Invalid: You cannot perform arithmetic directly on INPUT variables'
      ],
      correct: 0,
      explain: 'Inputs stored in numeric variables (INTEGER or REAL) retain their numeric properties and can immediately be used in arithmetic expressions.',
      hint: 'Numeric data types stored via INPUT can be directly multiplied or added.'
    },
    {
      id: 5,
      section: "User Input MCQs",
      type: "MCQ",
      title: "INPUT MCQ 5: String Concatenation Operator",
      desc: "Identify how string inputs are combined in CIE pseudocode.",
      objective: "Recognize the ampersand (&) operator used to join string variables in CIE pseudocode.",
      code: 'DECLARE FirstName : STRING\nDECLARE Surname : STRING\nINPUT FirstName\nINPUT Surname\n// Which line correctly combines both into FullName with a space between them?',
      options: [
        'FullName <- FirstName & " " & Surname',
        'FullName <- FirstName + " " + Surname',
        'FullName <- CONCAT(FirstName, Surname)',
        'FullName <- FirstName . " " . Surname'
      ],
      correct: 0,
      explain: 'The CIE specification explicitly defines the ampersand symbol (&) as the string concatenation operator.',
      hint: 'Look for the & operator used specifically for joining strings in CIE standards.'
    },

    // ==========================================
    // MODULE B: USER INPUT CODING CHALLENGES
    // ==========================================
    {
      id: 6,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 1: Basic Input & Declaration",
      desc: "Declare a variable and store user input.",
      objective: "Declare a STRING variable named 'FirstName' and accept user input into it.",
      challenge: "Write pseudocode to:\n1. Declare a variable named 'FirstName' as STRING.\n2. Output a prompt: \"Enter your first name:\"\n3. Input a value into 'FirstName'.\n4. Output the variable 'FirstName'.",
      need: ["DECLARE", "FirstName", "STRING", "OUTPUT", "\"Enter your first name:\"", "INPUT"],
      hint: "Use syntax:\nDECLARE FirstName : STRING\nOUTPUT \"Enter your first name:\"\nINPUT FirstName\nOUTPUT FirstName"
    },
    {
      id: 7,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 2: Sequential Inputs & Separate Outputs",
      desc: "Capture multiple inputs and print them on separate lines.",
      objective: "Input Surname and FirstName, then output FirstName and Surname on separate lines.",
      challenge: "Assume 'Surname' and 'FirstName' are already declared as STRING.\n\nWrite pseudocode to:\n1. Input 'Surname'\n2. Input 'FirstName'\n3. Output 'FirstName'\n4. Output 'Surname' (on a new line)",
      need: ["INPUT Surname", "INPUT FirstName", "OUTPUT FirstName", "OUTPUT Surname"],
      hint: "Call INPUT for Surname then FirstName. Then write two separate OUTPUT statements."
    },
    {
      id: 8,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 3: Output Multiple Inputs on One Line",
      desc: "Print multiple user inputs side-by-side.",
      objective: "Input Surname and FirstName, and output them together on a single line separated by a comma or space.",
      challenge: "Assume 'Surname' and 'FirstName' are already declared as STRING.\n\nWrite pseudocode to:\n1. Input 'Surname'\n2. Input 'FirstName'\n3. Output both variables on a single line with 'FirstName' first, then 'Surname'.",
      need: ["INPUT Surname", "INPUT FirstName", "OUTPUT", "FirstName", "Surname"],
      hint: "Use a single OUTPUT statement separating the two variables with a comma: OUTPUT FirstName, Surname"
    },
    {
      id: 9,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 4: String Concatenation with &",
      desc: "Combine string inputs into a single variable using &.",
      objective: "Concatenate two input strings using the & operator and store the result.",
      challenge: "Assume 'FirstName', 'Surname', and 'FullName' are already declared as STRING.\n\nWrite pseudocode to:\n1. Input 'FirstName'\n2. Input 'Surname'\n3. Join 'FirstName', a space \" \", and 'Surname' into 'FullName' using the & operator.\n4. Output 'FullName'",
      need: ["INPUT FirstName", "INPUT Surname", "FullName <-", "&", "OUTPUT FullName"],
      hint: "Join strings with &: FullName <- FirstName & \" \" & Surname"
    },
    {
      id: 10,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 5: Adding Two Inputs",
      desc: "Perform addition on user-entered numeric values.",
      objective: "Input two integers, calculate their total, store it in Total, and display it.",
      challenge: "Assume 'Num1', 'Num2', and 'Total' are already declared as INTEGER.\n\nWrite pseudocode to:\n1. Input 'Num1'\n2. Input 'Num2'\n3. Calculate the sum and store it in 'Total'\n4. Output 'Total'",
      need: ["INPUT Num1", "INPUT Num2", "Total <-", "+", "OUTPUT Total"],
      hint: "Calculate addition: Total <- Num1 + Num2 then OUTPUT Total"
    },
    {
      id: 11,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 6: Division with Text Label",
      desc: "Perform division on inputs and format output text.",
      objective: "Divide two REAL inputs and print the answer alongside an output label.",
      challenge: "Assume 'Num1', 'Num2', and 'Result' are already declared as REAL.\n\nWrite pseudocode to:\n1. Input 'Num1'\n2. Input 'Num2'\n3. Divide 'Num1' by 'Num2' and store in 'Result'\n4. Output: \"The answer is \" followed by 'Result'",
      need: ["INPUT Num1", "INPUT Num2", "Result <-", "/", "OUTPUT", "\"The answer is \"", "Result"],
      hint: "Divide using / operator: Result <- Num1 / Num2\nOutput using: OUTPUT \"The answer is \", Result"
    },
    {
      id: 12,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 7: Multi-Input Profile Formatting",
      desc: "Collect details and output formatted labels.",
      objective: "Capture Name, Age, and FavColor and output them formatted with descriptive labels.",
      challenge: "Assume 'Name' and 'FavColor' are STRING, and 'Age' is INTEGER.\n\nWrite pseudocode to:\n1. Input 'Name'\n2. Input 'Age'\n3. Input 'FavColor'\n4. Output in one line: \"Name: \", Name, \" Age: \", Age, \" Color: \", FavColor",
      need: ["INPUT Name", "INPUT Age", "INPUT FavColor", "OUTPUT", "\"Name: \"", "\" Age: \"", "\" Color: \""],
      hint: "Separate literals and variables with commas inside a single OUTPUT statement."
    },
    {
      id: 13,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 8: Multiple Calculations from Single Inputs",
      desc: "Process same inputs in multiple expressions.",
      objective: "Input two numbers, output their sum first, then output their product.",
      challenge: "Assume 'Num1', 'Num2', 'Sum', and 'Product' are already declared as INTEGER.\n\nWrite pseudocode to:\n1. Input 'Num1'\n2. Input 'Num2'\n3. Calculate 'Sum' (Num1 + Num2) and 'Product' (Num1 * Num2)\n4. Output 'Sum'\n5. Output 'Product'",
      need: ["INPUT Num1", "INPUT Num2", "+", "*", "OUTPUT Sum", "OUTPUT Product"],
      hint: "Calculate Sum <- Num1 + Num2 and Product <- Num1 * Num2, then output each."
    },
    {
      id: 14,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 9: Formula Calculation (Speed)",
      desc: "Apply mathematical formula using inputs.",
      objective: "Calculate Speed based on user Distance and Time inputs.",
      challenge: "Assume 'Distance', 'Time', and 'Speed' are already declared as REAL.\n\nWrite pseudocode to:\n1. Input 'Distance'\n2. Input 'Time'\n3. Calculate Speed using formula: Speed = Distance / Time\n4. Output 'Speed'",
      need: ["INPUT Distance", "INPUT Time", "Speed <-", "/", "OUTPUT Speed"],
      hint: "Use division operator /: Speed <- Distance / Time"
    },
    {
      id: 15,
      section: "Input Challenges",
      type: "Code",
      title: "Challenge 10: Phone Bill Total Calculator",
      desc: "Combine multiplication and addition on input values.",
      objective: "Calculate total cost based on inputs for call minutes and text messages.",
      challenge: "Assume 'Minutes' and 'Texts' are INTEGER, and 'TotalCost' is REAL.\nCall minutes cost 0.10 each and text messages cost 0.05 each.\n\nWrite pseudocode to:\n1. Input 'Minutes'\n2. Input 'Texts'\n3. Calculate TotalCost: (Minutes * 0.10) + (Texts * 0.05)\n4. Output 'TotalCost'",
      need: ["INPUT Minutes", "INPUT Texts", "TotalCost <-", "*", "+", "OUTPUT TotalCost"],
      hint: "Compute using operator precedence: TotalCost <- (Minutes * 0.10) + (Texts * 0.05)"
    }
  ];

  let currentIdx = 0;
  let score = 0;
  let mcqChosen = -1;

  function renderSidebar() {
    const listEl = document.getElementById("activityList");
    listEl.innerHTML = "";
    
    let currentSec = "";
    activities.forEach((act, idx) => {
      if (act.section !== currentSec) {
        currentSec = act.section;
        const h = document.createElement("h3");
        h.textContent = currentSec;
        h.style.marginTop = idx > 0 ? "14px" : "0px";
        listEl.appendChild(h);
      }

      const btn = document.createElement("div");
      btn.className = `step-item ${idx === currentIdx ? 'active' : ''}`;
      btn.innerHTML = `
        <span>${idx + 1}. ${act.title.split(':')[0]}</span>
        <span class="tag">${act.type}</span>
      `;
      btn.onclick = () => loadActivity(idx);
      listEl.appendChild(btn);
    });
    
    document.getElementById("progressStat").textContent = `${currentIdx + 1}/${activities.length}`;
    document.getElementById("scoreStat").textContent = score;
  }

  function loadActivity(idx) {
    currentIdx = idx;
    mcqChosen = -1;
    const act = activities[idx];

    document.getElementById("actTitle").textContent = act.title;
    document.getElementById("actDesc").textContent = act.desc;
    document.getElementById("actType").textContent = act.type === "MCQ" ? "Multiple Choice" : "Coding Challenge";
    document.getElementById("actObj").textContent = act.objective;

    hideFeedback();
    renderSidebar();

    const container = document.getElementById("viewContainer");
    if (act.type === "MCQ") {
      renderMCQView(container, act);
    } else {
      renderCodeView(container, act);
    }
  }

  function renderMCQView(container, act) {
    let html = `
      <div class="mcq-container">
        <div class="mcq-code">${act.code}</div>
        <div class="predict-options" id="mcqOptions">
    `;
    act.options.forEach((opt, idx) => {
      html += `<button data-idx="${idx}" onclick="handleMCQSelect(${idx})">${opt}</button>`;
    });
    html += `
        </div>
        <div class="buttons">
          <button class="action secondary" onclick="prevActivity()">⏮ Previous Activity</button>
          <button class="action hint" onclick="showHint()">💡 Hint</button>
          <button class="action next" onclick="nextActivity()">⏭ Next Activity</button>
        </div>
      </div>
    `;
    container.innerHTML = html;
  }

  function handleMCQSelect(idx) {
    const act = activities[currentIdx];
    if (mcqChosen !== -1) return;
    mcqChosen = idx;

    const btns = document.querySelectorAll("#mcqOptions button");
    btns.forEach((btn, bIdx) => {
      btn.disabled = true;
      if (bIdx === act.correct) {
        btn.classList.add("correct");
      } else if (bIdx === idx) {
        btn.classList.add("wrong");
      }
    });

    if (idx === act.correct) {
      score += 100;
      showFeedback("success", `✅ <b>Correct!</b> ${act.explain}`);
    } else {
      showFeedback("error", `❌ <b>Incorrect.</b> ${act.explain}`);
    }
    renderSidebar();
  }

  function renderCodeView(container, act) {
    container.innerHTML = `
      <div class="workspace">
        <div class="box">
          <div class="boxhead">📋 Challenge Specification</div>
          <div class="boxbody"><pre class="spec">${act.challenge}</pre></div>
        </div>
        <div class="box">
          <div class="boxhead">⌨️ Your Level 3 Pseudocode Solution</div>
          <div class="boxbody">
            <textarea id="codeEditor" placeholder="Type your CIE Pseudocode here..." spellcheck="false"></textarea>
            <div class="buttons">
              <button class="action" onclick="runInteractiveCode()">▶ Run & Check</button>
              <button class="action secondary" onclick="resetCodeEditor()">↻ Clear</button>
              <button class="action secondary" onclick="prevActivity()">⏮ Previous Activity</button>
              <button class="action hint" onclick="showHint()">💡 Hint</button>
              <button class="action next" onclick="nextActivity()">⏭ Next Activity</button>
            </div>
          </div>
        </div>
        <div class="box">
          <div class="boxhead">🖥️ Program Output</div>
          <div class="boxbody">
            <div id="outputDisplay" class="output-display">Press "Run & Check" to execute...</div>
          </div>
        </div>
      </div>
    `;
  }

  function runInteractiveCode() {
    const act = activities[currentIdx];
    const editor = document.getElementById("codeEditor");
    const outEl = document.getElementById("outputDisplay");
    const codeRaw = editor.value.trim();
    const codeUpper = codeRaw.toUpperCase();

    // Reset output display
    outEl.classList.remove("error-text");
    outEl.textContent = "";

    if (!codeRaw) {
      outEl.classList.add("error-text");
      outEl.textContent = "SyntaxError: No pseudocode entered.\nExecution halted.";
      showFeedback("error", "❌ Please write your solution before running.");
      return;
    }

    // Check for common student error: INPUT "VarName"
    if (/INPUT\s+\"[^\"]+\"/i.test(codeRaw)) {
      outEl.classList.add("error-text");
      outEl.textContent = "SyntaxError: Cannot take input into a quoted string literal.";
      showFeedback("error", "❌ Invalid INPUT statement! Do not put quotes around variable names in INPUT statements.");
      return;
    }

    // Check required keywords compliance
    const missing = act.need.filter(kw => !codeUpper.includes(kw.toUpperCase()));
    if (missing.length > 0) {
      outEl.classList.add("error-text");
      outEl.textContent = `SyntaxError: Pseudocode non-compliant with standard.\nMissing required element(s): ${missing.join(", ")}`;
      showFeedback("error", `❌ Syntax non-compliant. Missing expected element: <b>${missing.join(", ")}</b>`);
      return;
    }

    // Execute Pseudocode Live
    const lines = codeRaw.split('\n');
    const env = {};
    let logs = [];

    for (let line of lines) {
      let cleanLine = line.trim();
      if (!cleanLine || cleanLine.startsWith("//")) continue;

      // Handle DECLARE
      if (cleanLine.toUpperCase().startsWith("DECLARE")) {
        const match = cleanLine.match(/DECLARE\s+([A-Za-z0-9_]+)\s*:\s*(STRING|INTEGER|REAL)/i);
        if (match) {
          env[match[1]] = match[2].toUpperCase() === "STRING" ? "" : 0;
        }
        continue;
      }

      // Handle INPUT (Interactive Prompting)
      if (cleanLine.toUpperCase().startsWith("INPUT")) {
        const varName = cleanLine.replace(/INPUT/i, "").trim();
        const userVal = prompt(`INPUT REQUIRED:\nEnter value for variable [${varName}]:`);
        
        if (userVal === null) {
          outEl.classList.add("error-text");
          outEl.textContent = "Execution cancelled by user.";
          showFeedback("error", "❌ Input step was cancelled.");
          return;
        }

        if (!isNaN(userVal) && userVal.trim() !== "") {
          env[varName] = Number(userVal);
        } else {
          env[varName] = userVal;
        }
        logs.push(`[INPUT ${varName}: ${userVal}]`);
        continue;
      }

      // Handle Assignments (<-)
      if (cleanLine.includes("<-")) {
        const parts = cleanLine.split("<-");
        const varName = parts[0].trim();
        let expr = parts[1].trim();

        // Convert CIE string concatenation (&) to JavaScript standard (+)
        expr = expr.replace(/&/g, "+");

        // Inject current variable values into mathematical/string expression
        Object.keys(env).forEach(key => {
          const regex = new RegExp(`\\b${key}\\b`, 'g');
          const val = typeof env[key] === 'string' ? `"${env[key]}"` : env[key];
          expr = expr.replace(regex, val);
        });

        try {
          env[varName] = eval(expr);
        } catch (err) {
          outEl.classList.add("error-text");
          outEl.textContent = `Runtime Error in assignment expression: ${cleanLine}`;
          showFeedback("error", "❌ Failed to evaluate calculation statement.");
          return;
        }
        continue;
      }

      // Handle OUTPUT
      if (cleanLine.toUpperCase().startsWith("OUTPUT")) {
        let rawArg = cleanLine.replace(/OUTPUT/i, "").trim();
        const args = rawArg.split(",").map(a => a.trim());
        
        const printedValues = args.map(arg => {
          if (arg.startsWith('"') && arg.endsWith('"')) {
            return arg.slice(1, -1);
          }
          return env[arg] !== undefined ? env[arg] : arg;
        });

        logs.push(printedValues.join(""));
        continue;
      }
    }

    outEl.textContent = logs.join("\n");
    score += 100;
    showFeedback("success", "✅ <b>Success!</b> Pseudocode executed live and validated against CIE rules!");
    renderSidebar();
  }

  function resetCodeEditor() {
    const editor = document.getElementById("codeEditor");
    const outEl = document.getElementById("outputDisplay");
    if (editor) editor.value = "";
    if (outEl) {
      outEl.classList.remove("error-text");
      outEl.textContent = 'Press "Run & Check" to execute...';
    }
    hideFeedback();
  }

  function showHint() {
    const act = activities[currentIdx];
    showFeedback("info", `💡 <b>Hint:</b> ${act.hint}`);
  }

  function prevActivity() {
    if (currentIdx > 0) {
      loadActivity(currentIdx - 1);
    } else {
      showFeedback("info", "ℹ️ <b>First Activity!</b> You are already at the beginning of Level 3.");
    }
  }

  function nextActivity() {
    if (currentIdx < activities.length - 1) {
      loadActivity(currentIdx + 1);
    } else {
      showFeedback("info", "🎉 <b>Level 3 Complete!</b> You have mastered CIE User Input & Variable Expressions! Return to Home to start Level 4.");
    }
  }

  function showFeedback(type, message) {
    const fb = document.getElementById("feedback");
    fb.className = `feedback ${type}`;
    fb.innerHTML = message;
  }

  function hideFeedback() {
    const fb = document.getElementById("feedback");
    fb.className = "feedback";
    fb.innerHTML = "";
  }

  // Initial load on launch
  loadActivity(0);
</script>
</body>
</html>
