let currentIdx = 0, score = 0, selectedMcqOption = null;

function renderSubSections() {
  let el = document.getElementById("levelList");
  el.innerHTML = "";
  tasks.forEach((t, i) => {

    b.className = "level " + (i === currentIdx ? "active" : "");
    b.innerHTML = `Task ${i + 1}: ${t.title}<small>${t.sub}</small>`;
    b.onclick = () => loadTask(i);
    el.appendChild(b);
  });
}

    let html = `

      html += `<div class="mcq-option" id="opt${oIdx}" onclick="selectMcq(${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</div>`;

function insertIndent() {
  let ta = document.getElementById("code");
  if (!ta) return;
  let start = ta.selectionStart;
  let end = ta.selectionEnd;
  const spaces = "    ";
  ta.value = ta.value.substring(0, start) + spaces + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + spaces.length;
  ta.focus();
}

function selectMcq(oIdx) {

  t.options.forEach((_, i) => {

  });
}

function checkMcqAnswer() {
  let t = tasks[currentIdx];

  if (selectedMcqOption === null) {
    fb.className = "feedback error";
    fb.innerHTML = "⚠️ Please select an option before submitting.";
    return;
  }

  if (selectedMcqOption === t.answer) {
    score += 50;
    document.getElementById("score").textContent = score;
    fb.className = "feedback success";
    fb.innerHTML = "✅ <b>Correct!</b> Excellent choice. Click <b>Next Task</b> to proceed.";

    fb.className = "feedback error";
    fb.innerHTML = "❌ <b>Incorrect choice.</b> Review the question or click Hint for guidance.";

// 1. Indentation Checking Engine (Adopted from gemini-code-1788515134840.html)[cite: 8]
function checkMultiLevelIndentation(code) {
  const lines = code.split('\n');
  let currentDepth = 0;
  
  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const trimmed = rawLine.trim();
    if (!trimmed) continue;
    
    let upper = trimmed.toUpperCase();
    
    if (upper.startsWith("ENDIF") || upper.startsWith("ENDCASE") || upper.startsWith("NEXT") || upper.startsWith("ENDWHILE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    } else if (upper.startsWith("ELSE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    }

    const expectedSpaces = currentDepth * 4;
    const actualSpaces = rawLine.search(/\S|$/);

    if (actualSpaces < expectedSpaces) {
      return {
        valid: false,
        lineNum: i + 1,
        lineText: trimmed,
        expectedSpaces: expectedSpaces,
        actualSpaces: actualSpaces
      };
    }

    if (upper.includes("THEN") || upper.startsWith("ELSE") || upper.startsWith("CASE ")) {
      currentDepth++;
    }
  }

  return { valid: true };
}

// 2. Expression Evaluation Engine for Dynamic Variables
function evaluateExpression(expr, env) {
  let cleanExpr = expr.trim();
  
  // Handle LENGTH("...") function[cite: 8]
  cleanExpr = cleanExpr.replace(/LENGTH\s*\(\s*"(.*?)"\s*\)/gi, (match, str) => str.length);
  
  // Replace environment variable keys with their exact values
  Object.keys(env).forEach(key => {
    let val = env[key];
    let reg = new RegExp("\\b" + key + "\\b", "g");
    cleanExpr = cleanExpr.replace(reg, typeof val === "string" ? `"${val}"` : val);
  });

  // Convert pseudocode operator symbols to JavaScript equivalents
  cleanExpr = cleanExpr.replace(/=/g, "===")
                       .replace(/<===/g, "<=")
                       .replace(/>===/g, ">=")
                       .replace(/<>/g, "!==")
                       .replace(/\bOR\b/gi, "||")
                       .replace(/\bAND\b/gi, "&&");

  try {
    return Function(`"use strict"; return (${cleanExpr})`)();
  } catch (e) {
    return false;
  }
}

// 3. Dynamic Pseudocode Execution Engine
function executePseudocode(code, env) {
  let lines = code.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let outputs = [];
  let i = 0;

  function runBlock(stopKeywords) {
    while (i < lines.length) {
      let line = lines[i];
      let upper = line.toUpperCase();

      if (stopKeywords.some(k => upper.startsWith(k))) {
        return;
      }

      if (upper.startsWith("INPUT ")) {
        i++;
        continue;
      }

      if (upper.startsWith("IF ")) {
        let thenIdx = upper.indexOf(" THEN");
        let condStr = line.substring(3, thenIdx !== -1 ? thenIdx : line.length);
        let conditionMet = evaluateExpression(condStr, env);
        i++;

        if (conditionMet) {
          runBlock(["ELSE", "ENDIF"]);
          // Skip remaining ELSE block if present
          if (i < lines.length && lines[i].toUpperCase().startsWith("ELSE")) {
            i++;
            skipBlock(["ENDIF"]);
          }
        } else {
          skipBlock(["ELSE", "ENDIF"]);
          if (i < lines.length && lines[i].toUpperCase().startsWith("ELSE")) {
            i++;
            runBlock(["ENDIF"]);
          }
        }

        if (i < lines.length && lines[i].toUpperCase().startsWith("ENDIF")) {
          i++;
        }
        continue;
      }

      if (upper.startsWith("CASE OF ")) {
        let varName = line.substring(8).trim();
        let val = env[varName];
        let matched = false;
        i++;

        while (i < lines.length && !lines[i].toUpperCase().startsWith("ENDCASE")) {
          let cLine = lines[i];
          let cUpper = cLine.toUpperCase();

          if (cUpper.startsWith("OTHERWISE")) {
            if (!matched) {
              let outStr = cLine.substring(9).replace(/^[\s:]+/, "");
              if (outStr.toUpperCase().startsWith("OUTPUT ")) {
                outputs.push(evaluateExpression(outStr.substring(7), env));
              }
              matched = true;
            }
          } else if (cLine.includes(":")) {
            let parts = cLine.split(":");
            let caseVal = evaluateExpression(parts[0], env);
            if (!matched && (val === caseVal || val == caseVal)) {
              let outStr = parts[1].trim();
              if (outStr.toUpperCase().startsWith("OUTPUT ")) {
                outputs.push(evaluateExpression(outStr.substring(7), env));
              }
              matched = true;
            }
          }
          i++;
        }
        if (i < lines.length && lines[i].toUpperCase().startsWith("ENDCASE")) {
          i++;
        }
        continue;
      }

      if (upper.startsWith("OUTPUT ")) {
        let expr = line.substring(7);
        let evaluated = evaluateExpression(expr, env);
        outputs.push(evaluated);
        i++;
        continue;
      }

      i++;
    }
  }

  function skipBlock(stopKeywords) {
    let depth = 1;
    while (i < lines.length && depth > 0) {
      let upper = lines[i].toUpperCase();
      if (upper.startsWith("IF ")) depth++;
      if (upper.startsWith("ENDIF")) depth--;
      if (depth === 1 && stopKeywords.some(k => upper.startsWith(k))) {
        return;
      }
      i++;
    }
  }

  runBlock([]);
  return outputs.join("\n");
}

function runAndExecuteCode() {
  let codeRaw = document.getElementById("code").value;
  let t = tasks[currentIdx];
  let fb = document.getElementById("feedback");
  let outEl = document.getElementById("output");
  
  if (!codeRaw.trim()) {
    outEl.className = "output-display error-text";
    outEl.textContent = "Error: Code field is empty. Please enter pseudocode.";
    showFeedback("❌ Please enter pseudocode before running.", false);
    return;
  }

  // Step 1: Check required syntax keywords
  let upperCode = codeRaw.toUpperCase();
  let missing = t.need.filter(x => !upperCode.includes(x));
  if (missing.length > 0) {
    outEl.className = "output-display error-text";
    outEl.textContent = `SyntaxError: Missing required keyword(s): ${missing.join(", ")}`;
    showFeedback(`❌ Missing required keywords: <b>${missing.join(", ")}</b>`, false);
    return;
  }

  // Step 2: Validate 4-space uniform indentation[cite: 8]
  let indentCheck = checkMultiLevelIndentation(codeRaw);
  if (!indentCheck.valid) {
    outEl.className = "output-display error-text";
    outEl.textContent = `IndentationError (Line ${indentCheck.lineNum}): "${indentCheck.lineText}"\nExpected ${indentCheck.expectedSpaces} spaces for level depth, but found ${indentCheck.actualSpaces}.`;
    showFeedback(`❌ <b>Indentation Error:</b> Line ${indentCheck.lineNum} requires ${indentCheck.expectedSpaces} spaces.`, false);
    return;
  }

  // Step 3: Parse INPUT variables and prompt user[cite: 8]
  let lines = codeRaw.split('\n');
  let inputVariables = [];
  lines.forEach(line => {
    let trimmed = line.trim();
    if (trimmed.toUpperCase().startsWith("INPUT ")) {
      let varName = trimmed.substring(6).trim();
      if (varName && !inputVariables.includes(varName)) {
        inputVariables.push(varName);
      }
    }
  });

  let env = {};
  let terminalLog = "";
  for (let varName of inputVariables) {
    let defaultVal = (t.sampleInputs && t.sampleInputs[varName]) ? t.sampleInputs[varName] : "0";
    let userVal = prompt(`[Program Input]\nEnter value for variable '${varName}':`, defaultVal);
    if (userVal === null) {
      outEl.className = "output-display error-text";
      outEl.textContent = "Execution halted: Input cancelled by user.";
      hideFeedback();
      return;
    }
    env[varName] = !isNaN(userVal) && userVal.trim() !== "" ? Number(userVal) : userVal;
    terminalLog += `[INPUT] ${varName} = ${JSON.stringify(env[varName])}\n`;
  }

  // Step 4: Run AST condition execution engine
  let resultOutput = executePseudocode(codeRaw, env);
  terminalLog += `---------------------------------\n[OUTPUT]:\n${resultOutput || "(No output produced)"}\n---------------------------------\nExecution finished with 0 errors.`;

  outEl.className = "output-display";
  outEl.textContent = terminalLog;

  score += 100;
  document.getElementById("score").textContent = score;
  showFeedback("✅ <b>Execution Successful!</b> Indentation and logic validated.", true);
}

function prevTask() {
  if (currentIdx > 0) {
    loadTask(currentIdx - 1);
  } else {
    showFeedback("ℹ️ <b>First Task!</b> You are already at the beginning of Level 5.", false);
  }
}

function nextTask() {
  if (currentIdx < tasks.length - 1) {
    loadTask(currentIdx + 1);
  } else {
    loadTask(0);
  }
}

function showHint() {
  let fb = document.getElementById("feedback");
  fb.className = "feedback info";
  fb.innerHTML = "💡 " + tasks[currentIdx].hint;
}

function resetCode() {
  let t = tasks[currentIdx];
  let ta = document.getElementById("code");
  if (ta) ta.value = t.defaultCode || "";
  let outEl = document.getElementById("output");
  if (outEl) {
    outEl.className = "output-display";
    outEl.textContent = 'Press "Run & Execute" to validate indentation and test code logic...';
  }
  hideFeedback();
}

function showFeedback(msg, isSuccess) {
  let fb = document.getElementById("feedback");
  fb.className = "feedback " + (isSuccess ? "success" : "error");
  fb.innerHTML = msg;
}

function hideFeedback() {
  let fb = document.getElementById("feedback");
  if (fb) {
    fb.className = "feedback";
    fb.innerHTML = "";
  }
}

loadTask(0);
</script>
