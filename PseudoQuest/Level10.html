let currentIdx = 0, score = 0, selectedMcqOption = null;

function renderSubSections() {

              <button class="action hint" onclick="showHint()">💡 Hint</button>
              <button class="action prev" onclick="prevTask()">⏮ Previous Activity</button>
              <button class="action next" onclick="nextTask()">⏭ Next Activity</button>
            </div>
            <div id="feedback" class="feedback"></div>
          </div>
        </div>
        <div class="box">
          <div class="boxhead">🖥️ Interactive Execution Terminal</div>
          <div class="boxbody"><div id="output" class="output-display">Press "Run & Execute" to validate indentation and simulate 2D Array operations...</div></div>
        </div>
      </div>`;
    
    let ta = document.getElementById("code");
    ta.value = t.defaultCode || "";
    ta.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {

function insertIndent() {
  let ta = document.getElementById("code");
  if (!ta) return;
  let start = ta.selectionStart;
  let end = ta.selectionEnd;
  const spaces = "    ";
  ta.value = ta.value.substring(0, start) + spaces + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + spaces.length;
  ta.focus();
}

function selectMcq(oIdx) {
  selectedMcqOption = oIdx;
  let t = tasks[currentIdx];
  t.options.forEach((_, i) => {
    let el = document.getElementById("opt" + i);
    if (el) el.className = "mcq-option" + (i === oIdx ? " selected" : "");
  });
}

function checkMcqAnswer() {
  let t = tasks[currentIdx];
  let fb = document.getElementById("feedback");

  if (selectedMcqOption === null) {
    fb.className = "feedback error";
    fb.innerHTML = "⚠️ Please select an option before submitting.";
    return;
  }

  if (selectedMcqOption === t.answer) {
    if (!completedTasks.has(currentIdx)) {
      completedTasks.add(currentIdx);
      score += 50;
      document.getElementById("score").textContent = score;
    }
    fb.className = "feedback success";
    fb.innerHTML = "✅ <b>Correct!</b> Excellent job. Click <b>Next Activity</b> to proceed.";
  } else {
    fb.className = "feedback error";
    fb.innerHTML = "❌ <b>Incorrect choice.</b> Review the question or click Hint for guidance.";
  }
}

function checkMultiLevelIndentation(code) {
  const lines = code.split('\n');
  let currentDepth = 0;
  
  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const trimmed = rawLine.trim();
    if (!trimmed) continue;
    
    let upper = trimmed.toUpperCase();
    
    if (upper.startsWith("ENDWHILE") || upper.startsWith("ENDIF") || upper.startsWith("NEXT") || upper.startsWith("ENDCASE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    } else if (upper.startsWith("ELSE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    }

    const expectedSpaces = currentDepth * 4;
    const actualSpaces = rawLine.search(/\S|$/);

    if (actualSpaces < expectedSpaces) {
      return {
        valid: false,
        lineNum: i + 1,
        lineText: trimmed,
        expectedSpaces: expectedSpaces,
        actualSpaces: actualSpaces
      };
    }

    if ((upper.startsWith("WHILE ") && upper.includes(" DO")) || upper.includes("THEN") || upper.startsWith("ELSE") || upper.startsWith("FOR ")) {
      currentDepth++;
    }
  }

  return { valid: true };
}

/* === ENHANCED 1D / 2D ARRAY EVALUATOR === */
function evaluateExpr(expr, env, arrays) {
  let clean = String(expr).trim();
  const strings = [];

  // 1. Preserve explicit string literals
  clean = clean.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, m => {
    strings.push(m.slice(1, -1)); // Store bare text without quotes
    return `__STR_${strings.length - 1}__`;
  });

  // 2. Resolve 2D array lookups: Array[Dim1, Dim2]
  let has2D = true;
  while (has2D) {
    let replaced = false;
    clean = clean.replace(/([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^,\[\]]+)\s*,\s*([^,\[\]]+)\s*\]/g,
      function(match, arrName, d1Expr, d2Expr) {
        replaced = true;
        const d1Val = Math.round(Number(evaluateExpr(d1Expr, env, arrays)));
        const d2Val = Math.round(Number(evaluateExpr(d2Expr, env, arrays)));
        const key = `${d1Val},${d2Val}`;
        if (arrays && arrays[arrName] && Object.prototype.hasOwnProperty.call(arrays[arrName], key)) {
          const storedVal = arrays[arrName][key];
          if (typeof storedVal === "string") {
            strings.push(storedVal);
            return `__STR_${strings.length - 1}__`;
          }
          return String(storedVal);
        }
        return "0";
      });
    if (!replaced) has2D = false;
  }

  // 3. Resolve 1D array lookups: Array[Index]
  let has1D = true;
  while (has1D) {
    let replaced = false;
    clean = clean.replace(/([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\[\]]+)\s*\]/g,
      function(match, arrName, indexExpr) {
        replaced = true;
        const idxVal = Math.round(Number(evaluateExpr(indexExpr, env, arrays)));
        if (arrays && arrays[arrName] && Object.prototype.hasOwnProperty.call(arrays[arrName], idxVal)) {
          const storedVal = arrays[arrName][idxVal];
          if (typeof storedVal === "string") {
            strings.push(storedVal);
            return `__STR_${strings.length - 1}__`;
          }
          return String(storedVal);
        }
        return "0";
      });
    if (!replaced) has1D = false;
  }

  // 4. Substitute scalar variables
  Object.keys(env).sort((a, b) => b.length - a.length).forEach(k => {
    const reg = new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g");
    const value = env[k];
    if (typeof value === "string") {
      strings.push(value);
      clean = clean.replace(reg, `__STR_${strings.length - 1}__`);
    } else {
      clean = clean.replace(reg, String(value));
    }
  });

  // If the expression is purely a string token, return raw string value directly
  const pureStrMatch = clean.match(/^__STR_(\d+)__$/);
  if (pureStrMatch) {
    return strings[Number(pureStrMatch[1])];
  }

  // 5. Convert standard operators for JavaScript evaluation
  clean = clean.replace(/\bTRUE\b/gi, "true")
               .replace(/\bFALSE\b/gi, "false")
               .replace(/<>/g, "!=")
               .replace(/←/g, "=")
               .replace(/(^|[^<>!])=([^=])/g, "$1===$2")
               .replace(/\bAND\b/gi, "&&")
               .replace(/\bOR\b/gi, "||")
               .replace(/\bNOT\b/gi, "!");

  // Restore string placeholders into valid JS string literals
  clean = clean.replace(/__STR_(\d+)__/g, (_, i) => JSON.stringify(strings[Number(i)]));

  try {
    return Function(`"use strict"; return (${clean})`)();
  } catch (e) {
    return clean;
  }
}

/* === ENHANCED INTERPRETER FOR 1D & 2D ARRAYS === */
function executePseudocode(code) {
  const lines = code.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const outputs = [];
  const env = {};
  const arrays = {};
  let cancelled = false;
  let log = "Starting Level 10 Execution...\n";

  function findMatching(start, openType, closeType) {
    let depth = 0;
    for (let n = start; n < lines.length; n++) {
      const u = lines[n].toUpperCase();
      if (u.startsWith(openType)) depth++;
      if (u.startsWith(closeType)) {
        depth--;
        if (depth === 0) return n;
      }
    }
    return -1;
  }

  function findIfParts(start) {
    let depth = 0;
    let elseIndex = -1;
    for (let n = start; n < lines.length; n++) {
      const u = lines[n].toUpperCase();
      if (u.startsWith("IF ") && u.endsWith("THEN")) depth++;
      else if (u.startsWith("ENDIF")) {
        depth--;
        if (depth === 0) return { elseIndex, endIndex: n };
      } else if (u.startsWith("ELSE") && depth === 1 && elseIndex === -1) {
        elseIndex = n;
      }
    }
    return { elseIndex, endIndex: -1 };
  }

  function parseInputValue(raw) {
    const text = String(raw).trim();
    if (text === "") return "";
    if (/^-?(?:\d+\.?\d*|\.\d+)$/.test(text)) return Number(text);
    if (/^(TRUE|FALSE)$/i.test(text)) return /^TRUE$/i.test(text);
    return text;
  }

  function executeRange(start, endExclusive) {
    let pc = start;
    while (pc < endExclusive && !cancelled) {
      const line = lines[pc];
      const upper = line.toUpperCase();

      // DECLARE 2D or 1D ARRAY
      if (upper.startsWith("DECLARE ") && upper.includes("ARRAY")) {
        const colon = line.indexOf(":");
        const varName = line.substring(8, colon).trim();
        
        // 2D Match: ARRAY[1:2, 1:3]
        const m2d = line.match(/ARRAY\s*\[\s*(-?\d+)\s*:\s*(-?\d+)\s*,\s*(-?\d+)\s*:\s*(-?\d+)\s*\]/i);
        if (m2d) {
          const d1Lo = Number(m2d[1]), d1Hi = Number(m2d[2]);
          const d2Lo = Number(m2d[3]), d2Hi = Number(m2d[4]);
          arrays[varName] = {};
          for (let d1 = d1Lo; d1 <= d1Hi; d1++) {
            for (let d2 = d2Lo; d2 <= d2Hi; d2++) {
              arrays[varName][`${d1},${d2}`] = 0;
            }
          }
          log += `[2D Array Declared] ${varName}[${d1Lo}:${d1Hi}, ${d2Lo}:${d2Hi}]\n`;
          pc++;
          continue;
        }

        // 1D Match: ARRAY[1:5]
        const m1d = line.match(/ARRAY\s*\[\s*(-?\d+)\s*:\s*(-?\d+)\s*\]/i);
        if (m1d) {
          const lo = Number(m1d[1]), hi = Number(m1d[2]);
          arrays[varName] = {};
          for (let x = lo; x <= hi; x++) arrays[varName][x] = 0;
          log += `[1D Array Declared] ${varName}[${lo}:${hi}]\n`;
          pc++;
          continue;
        }

        throw new Error(`Invalid array declaration on line ${pc + 1}.`);
      }

      // DECLARE SCALAR
      if (upper.startsWith("DECLARE ")) {
        const beforeColon = line.substring(8).split(":")[0];
        beforeColon.split(",").map(v => v.trim()).filter(Boolean).forEach(v => env[v] = 0);
        pc++;
        continue;
      }

      // INPUT COMMAND
      if (upper.startsWith("INPUT ")) {
        const target = line.substring(6).trim();
        
        // Match 2D target
        const a2d = target.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^,]+)\s*,\s*([^\]]+)\s*\]$/);
        // Match 1D target
        const a1d = target.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\]]+)\s*\]$/);

        let arrName = null, key = null, label = target;

        if (a2d) {
          arrName = a2d[1];
          const d1 = Math.round(Number(evaluateExpr(a2d[2], env, arrays)));
          const d2 = Math.round(Number(evaluateExpr(a2d[3], env, arrays)));
          key = `${d1},${d2}`;
          label = `${arrName}[${d1}, ${d2}]`;
        } else if (a1d) {
          arrName = a1d[1];
          key = Math.round(Number(evaluateExpr(a1d[2], env, arrays)));
          label = `${arrName}[${key}]`;
        }

        const userVal = prompt(`[INPUT Required]\nEnter value for ${label}:`, "85");
        if (userVal === null) {
          cancelled = true;
          log += "[Execution Halted by User]\n";
          return;
        }

        const parsed = parseInputValue(userVal);
        if (arrName) {
          if (!arrays[arrName]) arrays[arrName] = {};
          arrays[arrName][key] = parsed;
          log += `[INPUT Stored] ${label} = ${parsed}\n`;
        } else {
          env[target] = parsed;
          log += `[INPUT Stored] ${target} = ${parsed}\n`;
        }
        pc++;
        continue;
      }

      // FOR LOOP
      if (upper.startsWith("FOR ")) {
        const nextIndex = findMatching(pc, "FOR ", "NEXT");
        if (nextIndex < 0) throw new Error(`FOR on line ${pc + 1} has no matching NEXT.`);
        const header = line.substring(4).trim();
        const parts = header.split(/\s+TO\s+/i);
        if (parts.length !== 2 || !parts[0].includes("←")) {
          throw new Error(`Invalid FOR statement on line ${pc + 1}.`);
        }
        const [varPart, startExpr] = parts[0].split("←");
        const varName = varPart.trim();
        const startValue = Number(evaluateExpr(startExpr, env, arrays));
        const endValue = Number(evaluateExpr(parts[1], env, arrays));
        const increment = startValue <= endValue ? 1 : -1;
        for (let value = startValue; increment > 0 ? value <= endValue : value >= endValue; value += increment) {
          env[varName] = value;
          executeRange(pc + 1, nextIndex);
          if (cancelled) return;
        }
        pc = nextIndex + 1;
        continue;
      }

      // IF BLOCK
      if (upper.startsWith("IF ")) {
        const parts = findIfParts(pc);
        if (parts.endIndex < 0) throw new Error(`IF on line ${pc + 1} has no matching ENDIF.`);
        const match = line.match(/^IF\s+(.*?)\s+THEN$/i);
        if (!match) throw new Error(`Invalid IF statement on line ${pc + 1}.`);
        const condition = Boolean(evaluateExpr(match[1], env, arrays));
        if (condition) {
          executeRange(pc + 1, parts.elseIndex >= 0 ? parts.elseIndex : parts.endIndex);
        } else if (parts.elseIndex >= 0) {
          executeRange(parts.elseIndex + 1, parts.endIndex);
        }
        if (cancelled) return;
        pc = parts.endIndex + 1;
        continue;
      }

      // OUTPUT
      if (upper.startsWith("OUTPUT ")) {
        const exprText = line.substring(7).trim();

        // Split OUTPUT arguments only on commas that are NOT inside
        // square brackets or quoted strings. This is essential for 2D
        // array references such as OUTPUT Marks[Student, Subject].
        const pieces = splitOutputArguments(exprText);
        outputs.push(pieces.map(p => evaluateExpr(p, env, arrays)).join(" "));
        pc++;
        continue;
      }

      // ASSIGNMENT (Scalar or Array Target)
      if (line.includes("←")) {
        const [leftPart, rightPart] = line.split("←");
        const left = leftPart.trim();
        const value = evaluateExpr(rightPart, env, arrays);
        
        const a2d = left.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^,]+)\s*,\s*([^\]]+)\s*\]$/);
        const a1d = left.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\]]+)\s*\]$/);

        if (a2d) {
          const arrName = a2d[1];
          const d1 = Math.round(Number(evaluateExpr(a2d[2], env, arrays)));
          const d2 = Math.round(Number(evaluateExpr(a2d[3], env, arrays)));
          if (!arrays[arrName]) arrays[arrName] = {};
          arrays[arrName][`${d1},${d2}`] = value;
          log += `[2D Array Update] ${arrName}[${d1}, ${d2}] = ${value}\n`;
        } else if (a1d) {
          const arrName = a1d[1];
          const idx = Math.round(Number(evaluateExpr(a1d[2], env, arrays)));
          if (!arrays[arrName]) arrays[arrName] = {};
          arrays[arrName][idx] = value;
          log += `[1D Array Update] ${arrName}[${idx}] = ${value}\n`;
        } else {
          env[left] = value;
          log += `[Var Update] ${left} = ${value}\n`;
        }
        pc++;
        continue;
      }

      if (upper.startsWith("NEXT") || upper.startsWith("ELSE") || upper.startsWith("ENDIF")) {
        pc++;
        continue;
      }

      pc++;
    }
  }

  try {
    executeRange(0, lines.length);
  } catch (error) {
    return { cancelled: false, error: error.message, log, output: outputs.join("\n") };
  }
  return { cancelled, log, output: outputs.join("\n") };
}


function splitOutputArguments(text) {
  const parts = [];
  let current = "";
  let bracketDepth = 0;
  let quote = null;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (quote) {
      current += ch;
      if (ch === quote && text[i - 1] !== "\\") quote = null;
      continue;
    }

    if (ch === '"' || ch === "'") {
      quote = ch;
      current += ch;
      continue;
    }

    if (ch === "[") bracketDepth++;
    else if (ch === "]") bracketDepth = Math.max(0, bracketDepth - 1);

    if (ch === "," && bracketDepth === 0) {
      if (current.trim()) parts.push(current.trim());
      current = "";
    } else {
      current += ch;
    }
  }

  if (current.trim()) parts.push(current.trim());
  return parts;
}

function runAndExecuteCode() {
  let codeRaw = document.getElementById("code").value;
  let t = tasks[currentIdx];
  let outEl = document.getElementById("output");
  
  if (!codeRaw.trim()) {
    outEl.className = "output-display error-text";
    outEl.textContent = "Error: Code field is empty.";
    showFeedback("❌ Please enter pseudocode before running.", false);
    return;
  }

  let upperCode = codeRaw.toUpperCase();
  let missing = t.need.filter(x => !upperCode.includes(x));
  if (missing.length > 0) {
    outEl.className = "output-display error-text";
    outEl.textContent = `SyntaxError: Missing required keyword(s): ${missing.join(", ")}`;
    showFeedback(`❌ Missing required keywords: <b>${missing.join(", ")}</b>`, false);
    return;
  }

  let indentCheck = checkMultiLevelIndentation(codeRaw);
  if (!indentCheck.valid) {
    outEl.className = "output-display error-text";
    outEl.textContent = `IndentationError (Line ${indentCheck.lineNum}): "${indentCheck.lineText}"\nExpected ${indentCheck.expectedSpaces} spaces, found ${indentCheck.actualSpaces}.`;
    showFeedback(`❌ <b>Indentation Error:</b> Line ${indentCheck.lineNum} requires ${indentCheck.expectedSpaces} spaces.`, false);
    return;
  }

  let result = executePseudocode(codeRaw);

  if (result.error) {
    outEl.className = "output-display error-text";
    outEl.textContent = `ExecutionError: ${result.error}`;
    showFeedback(`❌ <b>Execution Error:</b> ${result.error}`, false);
    return;
  }

  if (result.cancelled) {
    outEl.className = "output-display error-text";
    outEl.textContent = result.log;
    hideFeedback();
    return;
  }

  outEl.className = "output-display";
  outEl.textContent = result.log + "---------------------------------\n[OUTPUT]:\n" + result.output;

  if (!completedTasks.has(currentIdx)) {
    completedTasks.add(currentIdx);
    score += 100;
    document.getElementById("score").textContent = score;
  }
  showFeedback("✅ <b>Execution Successful!</b> 2D Array operations and syntax verified.", true);
}

function prevTask() {
  if (currentIdx > 0) {
    loadTask(currentIdx - 1);
  } else {
    loadTask(tasks.length - 1);
  }
}

function nextTask() {
  if (currentIdx < tasks.length - 1) {
    loadTask(currentIdx + 1);
  } else {
    loadTask(0);
  }
}

function showHint() {
  let fb = document.getElementById("feedback");
  fb.className = "feedback info";
  fb.innerHTML = "💡 " + tasks[currentIdx].hint;
}

function resetCode() {
  let t = tasks[currentIdx];
  let ta = document.getElementById("code");
  if (ta) ta.value = t.defaultCode || "";
  let outEl = document.getElementById("output");
  if (outEl) {
    outEl.className = "output-display";
    outEl.textContent = 'Press "Run & Execute" to validate indentation and simulate 2D Array operations...';
  }
  hideFeedback();
}

function showFeedback(msg, isSuccess) {
  let fb = document.getElementById("feedback");
  fb.className = "feedback " + (isSuccess ? "success" : "error");
  fb.innerHTML = msg;
}

function hideFeedback() {
  let fb = document.getElementById("feedback");
  if (fb) {
    fb.className = "feedback";
    fb.innerHTML = "";
  }
}

loadTask(0);
</script>
