function insertIndent() {
  let ta = document.getElementById("code");
  if (!ta) return;
  let start = ta.selectionStart;
  let end = ta.selectionEnd;
  const spaces = "    ";
  ta.value = ta.value.substring(0, start) + spaces + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + spaces.length;
  ta.focus();
}

function checkMultiLevelIndentation(code) {
  const lines = code.split('\n');
  let currentDepth = 0;
  
  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const trimmed = rawLine.trim();
    if (!trimmed) continue;
    
    let upper = trimmed.toUpperCase();
    
    if (upper.startsWith("ENDWHILE") || upper.startsWith("ENDIF") || upper.startsWith("NEXT") || upper.startsWith("ENDCASE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    } else if (upper.startsWith("ELSE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    }

    const expectedSpaces = currentDepth * 4;
    const actualSpaces = rawLine.search(/\S|$/);

    if (actualSpaces < expectedSpaces) {
      return {
        valid: false,
        lineNum: i + 1,
        lineText: trimmed,
        expectedSpaces: expectedSpaces,
        actualSpaces: actualSpaces
      };
    }

    if ((upper.startsWith("WHILE ") && upper.includes(" DO")) || upper.includes("THEN") || upper.startsWith("ELSE") || upper.startsWith("FOR ")) {
      currentDepth++;
    }
  }

  return { valid: true };
}

/* === ARRAY PSEUDOCODE EXECUTION ENGINE === */
function evaluateExpr(expr, env, arrays) {
  let clean = String(expr).trim();
  const strings = [];

  // Protect quoted strings while variables and operators are translated.
  clean = clean.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, m => {
    strings.push(m);
    return `__STR_${strings.length - 1}__`;
  });

  // Resolve array access first, including expressions such as Values[i].
  clean = clean.replace(/([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\]]+)\s*\]/g,
    function(match, arrName, indexExpr) {
      const idxValue = evaluateExpr(indexExpr, env, arrays);
      const idx = Math.round(Number(idxValue));
      if (arrays && arrays[arrName] && Object.prototype.hasOwnProperty.call(arrays[arrName], idx)) {
        return JSON.stringify(arrays[arrName][idx]);
      }
      return "0";
    });

  // Substitute scalar variables, longest names first.
  Object.keys(env).sort((a, b) => b.length - a.length).forEach(k => {
    const reg = new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g");
    const value = env[k];
    clean = clean.replace(reg, typeof value === "string" ? JSON.stringify(value) : String(value));
  });

  clean = clean.replace(/\bTRUE\b/gi, "true")
               .replace(/\bFALSE\b/gi, "false")
               .replace(/<>/g, "!=")
               .replace(/←/g, "=")
               .replace(/(^|[^<>!])=([^=])/g, "$1===$2")
               .replace(/AND/gi, "&&")
               .replace(/OR/gi, "||")
               .replace(/NOT/gi, "!");

  clean = clean.replace(/__STR_(\d+)__/g, (_, i) => strings[Number(i)]);

  try {
    return Function(`"use strict"; return (${clean})`)();
  } catch (e) {
    return clean;
  }
}

function executePseudocode(code) {
  const lines = code.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const outputs = [];
  const env = {};
  const arrays = {};
  let cancelled = false;
  let log = "Starting Execution...\n";

  function findMatching(start, openType, closeType) {
    let depth = 0;
    for (let n = start; n < lines.length; n++) {
      const u = lines[n].toUpperCase();
      if (u.startsWith(openType)) depth++;
      if (u.startsWith(closeType)) {
        depth--;
        if (depth === 0) return n;
      }
    }
    return -1;
  }

  function findIfParts(start) {
    let depth = 0;
    let elseIndex = -1;
    for (let n = start; n < lines.length; n++) {
      const u = lines[n].toUpperCase();
      if (u.startsWith("IF ") && u.endsWith("THEN")) depth++;
      else if (u.startsWith("ENDIF")) {
        depth--;
        if (depth === 0) return { elseIndex, endIndex: n };
      } else if (u.startsWith("ELSE") && depth === 1 && elseIndex === -1) {
        elseIndex = n;
      }
    }
    return { elseIndex, endIndex: -1 };
  }

  function parseInputValue(raw) {
    const text = String(raw).trim();
    if (text === "") return "";
    if (/^-?(?:\d+\.?\d*|\.\d+)$/.test(text)) return Number(text);
    if (/^(TRUE|FALSE)$/i.test(text)) return /^TRUE$/i.test(text);
    return text;
  }

  function executeRange(start, endExclusive) {
    let pc = start;
    while (pc < endExclusive && !cancelled) {
      const line = lines[pc];
      const upper = line.toUpperCase();

      if (upper.startsWith("DECLARE ") && upper.includes("ARRAY")) {
        const colon = line.indexOf(":");
        const varName = line.substring(8, colon).trim();
        const m = line.match(/ARRAY\s*\[\s*(-?\d+)\s*:\s*(-?\d+)\s*\]/i);
        if (!m) throw new Error(`Invalid array declaration on line ${pc + 1}.`);
        const lo = Number(m[1]), hi = Number(m[2]);
        arrays[varName] = {};
        for (let x = lo; x <= hi; x++) arrays[varName][x] = 0;
        log += `[Array Declared] ${varName}[${lo}:${hi}]\n`;
        pc++;
        continue;
      }

      if (upper.startsWith("DECLARE ")) {
        const beforeColon = line.substring(8).split(":")[0];
        beforeColon.split(",").map(v => v.trim()).filter(Boolean).forEach(v => env[v] = 0);
        pc++;
        continue;
      }

      if (upper.startsWith("INPUT ")) {
        const target = line.substring(6).trim();
        const a = target.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\]]+)\s*\]$/);
        const arrName = a ? a[1] : null;
        const idx = a ? Math.round(Number(evaluateExpr(a[2], env, arrays))) : null;
        const label = a ? `${arrName}[${idx}]` : target;
        const userVal = prompt(`[INPUT Required]\nEnter value for ${label}:`, "85");
        if (userVal === null) {
          cancelled = true;
          log += "[Execution Halted by User]\n";
          return;
        }
        const parsed = parseInputValue(userVal);
        if (arrName) {
          if (!arrays[arrName]) arrays[arrName] = {};
          arrays[arrName][idx] = parsed;
          log += `[INPUT Stored] ${arrName}[${idx}] = ${parsed}\n`;
        } else {
          env[target] = parsed;
          log += `[INPUT Stored] ${target} = ${parsed}\n`;
        }
        pc++;
        continue;
      }

      if (upper.startsWith("FOR ")) {
        const nextIndex = findMatching(pc, "FOR ", "NEXT");
        if (nextIndex < 0) throw new Error(`FOR on line ${pc + 1} has no matching NEXT.`);
        const header = line.substring(4).trim();
        const parts = header.split(/\s+TO\s+/i);
        if (parts.length !== 2 || !parts[0].includes("←")) {
          throw new Error(`Invalid FOR statement on line ${pc + 1}.`);
        }
        const [varPart, startExpr] = parts[0].split("←");
        const varName = varPart.trim();
        const startValue = Number(evaluateExpr(startExpr, env, arrays));
        const endValue = Number(evaluateExpr(parts[1], env, arrays));
        const increment = startValue <= endValue ? 1 : -1;
        for (let value = startValue; increment > 0 ? value <= endValue : value >= endValue; value += increment) {
          env[varName] = value;
          executeRange(pc + 1, nextIndex);
          if (cancelled) return;
        }
        pc = nextIndex + 1;
        continue;
      }

      if (upper.startsWith("IF ")) {
        const parts = findIfParts(pc);
        if (parts.endIndex < 0) throw new Error(`IF on line ${pc + 1} has no matching ENDIF.`);
        const match = line.match(/^IF\s+(.*?)\s+THEN$/i);
        if (!match) throw new Error(`Invalid IF statement on line ${pc + 1}.`);
        const condition = Boolean(evaluateExpr(match[1], env, arrays));
        if (condition) {
          executeRange(pc + 1, parts.elseIndex >= 0 ? parts.elseIndex : parts.endIndex);
        } else if (parts.elseIndex >= 0) {
          executeRange(parts.elseIndex + 1, parts.endIndex);
        }
        if (cancelled) return;
        pc = parts.endIndex + 1;
        continue;
      }

      if (upper.startsWith("OUTPUT ")) {
        const exprText = line.substring(7).trim();
        // Split OUTPUT arguments only at top-level commas.
        const pieces = exprText.split(/,(?![^"']*["'])/).map(v => v.trim()).filter(Boolean);
        outputs.push(pieces.map(p => evaluateExpr(p, env, arrays)).join(" "));
        pc++;
        continue;
      }

      if (line.includes("←")) {
        const [leftPart, rightPart] = line.split("←");
        const left = leftPart.trim();
        const value = evaluateExpr(rightPart, env, arrays);
        const a = left.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\]]+)\s*\]$/);
        if (a) {
          const arrName = a[1];
          const idx = Math.round(Number(evaluateExpr(a[2], env, arrays)));
          if (!arrays[arrName]) arrays[arrName] = {};
          arrays[arrName][idx] = value;
          log += `[Array Update] ${arrName}[${idx}] = ${value}\n`;
        } else {
          env[left] = value;
          log += `[Var Update] ${left} = ${value}\n`;
        }
        pc++;
        continue;
      }

      // NEXT / ELSE / ENDIF should normally be consumed by their parent block.
      if (upper.startsWith("NEXT") || upper.startsWith("ELSE") || upper.startsWith("ENDIF")) {
        pc++;
        continue;
      }

      pc++;
    }
  }

  try {
    executeRange(0, lines.length);
  } catch (error) {
    return { cancelled: false, error: error.message, log, output: outputs.join("\n") };
  }
  return { cancelled, log, output: outputs.join("\n") };
}

function runAndExecuteCode() {
  let codeRaw = document.getElementById("code").value;
  let t = tasks[currentIdx];
  let outEl = document.getElementById("output");
  
  if (!codeRaw.trim()) {
    outEl.className = "output-display error-text";
    outEl.textContent = "Error: Code field is empty.";
    showFeedback("❌ Please enter pseudocode before running.", false);
    return;
  }

  let upperCode = codeRaw.toUpperCase();
  let missing = t.need.filter(x => !upperCode.includes(x));
  if (missing.length > 0) {
    outEl.className = "output-display error-text";
    outEl.textContent = `SyntaxError: Missing required keyword(s): ${missing.join(", ")}`;
    showFeedback(`❌ Missing required keywords: <b>${missing.join(", ")}</b>`, false);
    return;
  }

  let indentCheck = checkMultiLevelIndentation(codeRaw);
  if (!indentCheck.valid) {
    outEl.className = "output-display error-text";
    outEl.textContent = `IndentationError (Line ${indentCheck.lineNum}): "${indentCheck.lineText}"\nExpected ${indentCheck.expectedSpaces} spaces, found ${indentCheck.actualSpaces}.`;
    showFeedback(`❌ <b>Indentation Error:</b> Line ${indentCheck.lineNum} requires ${indentCheck.expectedSpaces} spaces.`, false);
    return;
  }

  let result = executePseudocode(codeRaw);

  if (result.error) {
    outEl.className = "output-display error-text";
    outEl.textContent = `ExecutionError: ${result.error}`;
    showFeedback(`❌ <b>Execution Error:</b> ${result.error}`, false);
    return;
  }

  if (result.cancelled) {
    outEl.className = "output-display error-text";
    outEl.textContent = result.log;
    hideFeedback();
    return;
  }

  outEl.className = "output-display";
  outEl.textContent = result.log + "---------------------------------\n[OUTPUT]:\n" + result.output;

  if (!completedTasks.has(currentIdx)) {
    completedTasks.add(currentIdx);
    score += 100;
    document.getElementById("score").textContent = score;
  }
  showFeedback("✅ <b>Execution Successful!</b> The pseudocode ran correctly with your input.", true);
}

function prevTask() {
  if (currentIdx > 0) {
    loadTask(currentIdx - 1);
  } else {
    loadTask(tasks.length - 1);
  }
}

function nextTask() {
  if (currentIdx < tasks.length - 1) {
    loadTask(currentIdx + 1);
  } else {
    loadTask(0);
  }
}

function showHint() {
  let fb = document.getElementById("feedback");
  fb.className = "feedback info";
  fb.innerHTML = "💡 " + tasks[currentIdx].hint;
}

function resetCode() {
  let t = tasks[currentIdx];
  let ta = document.getElementById("code");
  if (ta) ta.value = t.defaultCode || "";
  let outEl = document.getElementById("output");
  if (outEl) {
    outEl.className = "output-display";
    outEl.textContent = 'Press "Run & Execute" to validate indentation and simulate the pseudocode. INPUT statements will ask for each value in sequence.';
  }
  hideFeedback();
}

function showFeedback(msg, isSuccess) {
  let fb = document.getElementById("feedback");
  fb.className = "feedback " + (isSuccess ? "success" : "error");
  fb.innerHTML = msg;
}

function hideFeedback() {
  let fb = document.getElementById("feedback");
  if (fb) {
    fb.className = "feedback";
    fb.innerHTML = "";
  }
}

loadTask(0);
</script>
