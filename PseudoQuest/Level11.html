let currentIdx = 0, score = 0, selectedMcqOption = null;

}

    ta.value = t.defaultCode || "";

function insertIndent() {
  let ta = document.getElementById("code");
  if (!ta) return;
  let start = ta.selectionStart;
  let end = ta.selectionEnd;
  const spaces = "    ";
  ta.value = ta.value.substring(0, start) + spaces + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + spaces.length;
  ta.focus();
}

function selectMcq(oIdx) {
  selectedMcqOption = oIdx;
  let t = tasks[currentIdx];
  t.options.forEach((_, i) => {

    if (el) el.className = "mcq-option" + (i === oIdx ? " selected" : "");
  });

function checkMcqAnswer() {
  let t = tasks[currentIdx];

  if (selectedMcqOption === null) {
    fb.className = "feedback error";
    fb.innerHTML = "⚠️ Please select an option before submitting.";

  }

  if (selectedMcqOption === t.answer) {
    if (!completedTasks.has(currentIdx)) {
      completedTasks.add(currentIdx);
      score += 50;
      document.getElementById("score").textContent = score;
    }
    fb.className = "feedback success";
    fb.innerHTML = "✅ <b>Correct!</b> Excellent job. Click <b>Next Activity</b> to proceed.";
  } else {
    fb.className = "feedback error";
    fb.innerHTML = "❌ <b>Incorrect choice.</b> Review the question or click Hint for guidance.";
  }
}

function checkMultiLevelIndentation(code) {
  const lines = code.split('\n');
  let currentDepth = 0;
  
  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const trimmed = rawLine.trim();
    if (!trimmed) continue;
    
    let upper = trimmed.toUpperCase();
    
    if (upper.startsWith("ENDWHILE") || upper.startsWith("ENDIF") || upper.startsWith("NEXT") || upper.startsWith("ENDCASE") || upper.startsWith("ENDPROCEDURE") || upper.startsWith("ENDFUNCTION")) {
      currentDepth = Math.max(0, currentDepth - 1);
    } else if (upper.startsWith("ELSE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    }

    const expectedSpaces = currentDepth * 4;
    const actualSpaces = rawLine.search(/\S|$/);

    if (actualSpaces < expectedSpaces) {
      return {
        valid: false,
        lineNum: i + 1,
        lineText: trimmed,
        expectedSpaces: expectedSpaces,
        actualSpaces: actualSpaces
      };
    }

    if ((upper.startsWith("WHILE ") && upper.includes(" DO")) || upper.includes("THEN") || upper.startsWith("ELSE") || upper.startsWith("FOR ") || upper.startsWith("PROCEDURE ") || upper.startsWith("FUNCTION ")) {
      currentDepth++;
    }
  }

  return { valid: true };
}

/* === INTERPRETER WITH PROCEDURES & FUNCTIONS SUPPORT === */
function evaluateExpr(expr, env, arrays, subroutines) {
  let clean = String(expr).trim();
  const strings = [];

  clean = clean.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, m => {
    strings.push(m.slice(1, -1));
    return `__STR_${strings.length - 1}__`;
  });

  // Evaluate function calls embedded in expressions
  if (subroutines) {
    let hasFunc = true;
    while (hasFunc) {
      let replaced = false;
      clean = clean.replace(/([a-zA-Z_][a-zA-Z0-9_]*)\s*\(([^()]*)\)/g, function(match, name, argsStr) {
        if (subroutines[name] && subroutines[name].type === "FUNCTION") {
          replaced = true;
          const rawArgs = splitOutputArguments(argsStr);
          const evalArgs = rawArgs.map(a => evaluateExpr(a, env, arrays, subroutines));
          const retVal = executeSubroutine(subroutines[name], evalArgs, env, arrays, subroutines);
          if (typeof retVal === "string") {
            strings.push(retVal);
            return `__STR_${strings.length - 1}__`;
          }
          return String(retVal);
        }
        return match;
      });
      if (!replaced) hasFunc = false;
    }
  }

  // Resolve 1D Array lookups
  let has1D = true;
  while (has1D) {
    let replaced = false;
    clean = clean.replace(/([a-zA-Z_][a-zA-Z0-9_]*)\s*\[\s*([^\[\]]+)\s*\]/g, function(match, arrName, indexExpr) {
      replaced = true;
      const idxVal = Math.round(Number(evaluateExpr(indexExpr, env, arrays, subroutines)));
      if (arrays && arrays[arrName] && Object.prototype.hasOwnProperty.call(arrays[arrName], idxVal)) {
        const storedVal = arrays[arrName][idxVal];
        if (typeof storedVal === "string") {
          strings.push(storedVal);
          return `__STR_${strings.length - 1}__`;
        }
        return String(storedVal);
      }
      return "0";
    });
    if (!replaced) has1D = false;
  }

  // Substitute scalar variables
  Object.keys(env).sort((a, b) => b.length - a.length).forEach(k => {
    const reg = new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g");
    const value = env[k];
    if (typeof value === "string") {
      strings.push(value);
      clean = clean.replace(reg, `__STR_${strings.length - 1}__`);
    } else {
      clean = clean.replace(reg, String(value));
    }
  });

  const pureStrMatch = clean.match(/^__STR_(\d+)__$/);
  if (pureStrMatch) {
    return strings[Number(pureStrMatch[1])];
  }

  clean = clean.replace(/\bTRUE\b/gi, "true")
               .replace(/\bFALSE\b/gi, "false")
               .replace(/\bMOD\b/gi, "%")
               .replace(/<>/g, "!=")
               .replace(/←/g, "=")
               .replace(/(^|[^<>!])=([^=])/g, "$1===$2")
               .replace(/\bAND\b/gi, "&&")
               .replace(/\bOR\b/gi, "||")
               .replace(/\bNOT\b/gi, "!");

  clean = clean.replace(/__STR_(\d+)__/g, (_, i) => JSON.stringify(strings[Number(i)]));

  try {
    return Function(`"use strict"; return (${clean})`)();
  } catch (e) {
    return clean;
  }
}

function executeSubroutine(sub, argValues, callerEnv, arrays, subroutines) {
  const localEnv = { ...callerEnv };
  const byRefMap = {};

  sub.params.forEach((p, idx) => {
    localEnv[p.name] = argValues[idx] !== undefined ? argValues[idx] : 0;
    if (p.isByRef) {
      byRefMap[p.name] = sub.rawArgNames[idx];
    }
  });

  const lines = sub.body;
  let pc = 0;
  let returnValue = undefined;

  function findIfParts(start) {
    let depth = 0;
    let elseIndex = -1;
    for (let n = start; n < lines.length; n++) {
      const u = lines[n].toUpperCase();
      if (u.startsWith("IF ") && u.endsWith("THEN")) depth++;
      else if (u.startsWith("ENDIF")) {
        depth--;
        if (depth === 0) return { elseIndex, endIndex: n };
      } else if (u.startsWith("ELSE") && depth === 1 && elseIndex === -1) {
        elseIndex = n;
      }
    }
    return { elseIndex, endIndex: -1 };
  }

  function executeRange(start, endExclusive) {
    let idx = start;
    while (idx < endExclusive && returnValue === undefined) {
      const line = lines[idx];
      const upper = line.toUpperCase();

      if (upper.startsWith("DECLARE ")) {
        const beforeColon = line.substring(8).split(":")[0];
        beforeColon.split(",").map(v => v.trim()).filter(Boolean).forEach(v => localEnv[v] = 0);
        idx++;
        continue;
      }

      if (upper.startsWith("RETURN ")) {
        returnValue = evaluateExpr(line.substring(7).trim(), localEnv, arrays, subroutines);
        return;
      }

      if (upper.startsWith("IF ")) {
        const parts = findIfParts(idx);
        const match = line.match(/^IF\s+(.*?)\s+THEN$/i);
        const condition = Boolean(evaluateExpr(match[1], localEnv, arrays, subroutines));
        if (condition) {
          executeRange(idx + 1, parts.elseIndex >= 0 ? parts.elseIndex : parts.endIndex);
        } else if (parts.elseIndex >= 0) {
          executeRange(parts.elseIndex + 1, parts.endIndex);
        }
        if (returnValue !== undefined) return;
        idx = parts.endIndex + 1;
        continue;
      }

      if (upper.startsWith("OUTPUT ")) {
        const exprText = line.substring(7).trim();
        const pieces = splitOutputArguments(exprText);
        sub.outputs.push(pieces.map(p => evaluateExpr(p, localEnv, arrays, subroutines)).join(" "));
        idx++;
        continue;
      }

      if (line.includes("←")) {
        const [left, right] = line.split("←").map(s => s.trim());
        const val = evaluateExpr(right, localEnv, arrays, subroutines);
        localEnv[left] = val;
        if (byRefMap[left]) {
          callerEnv[byRefMap[left]] = val;
        }
        idx++;
        continue;
      }

      idx++;
    }
  }

  executeRange(0, lines.length);

  Object.keys(byRefMap).forEach(pName => {
    callerEnv[byRefMap[pName]] = localEnv[pName];
  });

  return returnValue;
}

function parseSubroutineHeader(header, type) {
  const isFunc = type === "FUNCTION";
  let name = "";
  let paramStr = "";

  if (isFunc) {
    const match = header.match(/^FUNCTION\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*\((.*?)\)\s*RETURNS\s+([a-zA-Z_]+)/i);
    if (!match) throw new Error("Invalid FUNCTION header format.");
    name = match[1];
    paramStr = match[2];
  } else {
    const match = header.match(/^PROCEDURE\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*\((.*?)\)/i);
    if (!match) throw new Error("Invalid PROCEDURE header format.");
    name = match[1];
    paramStr = match[2];
  }

  const params = [];
  if (paramStr.trim()) {
    const pTokens = paramStr.split(",");
    pTokens.forEach(p => {
      let trimmed = p.trim();
      let isByRef = false;
      if (trimmed.toUpperCase().startsWith("BYREF ")) {
        isByRef = true;
        trimmed = trimmed.substring(6).trim();
      } else if (trimmed.toUpperCase().startsWith("BYVAL ")) {
        trimmed = trimmed.substring(6).trim();
      }
      const parts = trimmed.split(":");
      params.push({ name: parts[0].trim(), type: parts[1] ? parts[1].trim() : "INTEGER", isByRef });
    });
  }

  return { name, params, type };
}

function executePseudocode(code) {
  const lines = code.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const outputs = [];
  const env = {};
  const arrays = {};
  const subroutines = {};
  let log = "Starting Level 11 Execution...\n";

  // Pre-pass: Register Subroutines
  let i = 0;
  const mainProgramLines = [];
  while (i < lines.length) {
    const line = lines[i];
    const upper = line.toUpperCase();

    if (upper.startsWith("PROCEDURE ") || upper.startsWith("FUNCTION ")) {
      const type = upper.startsWith("PROCEDURE ") ? "PROCEDURE" : "FUNCTION";
      const endKeyword = type === "PROCEDURE" ? "ENDPROCEDURE" : "ENDFUNCTION";
      const subInfo = parseSubroutineHeader(line, type);
      const body = [];
      i++;
      while (i < lines.length && !lines[i].toUpperCase().startsWith(endKeyword)) {
        body.push(lines[i]);
        i++;
      }
      subInfo.body = body;
      subInfo.outputs = outputs;
      subroutines[subInfo.name] = subInfo;
      log += `[Subroutine Registered] ${type} ${subInfo.name}\n`;
      i++;
      continue;
    }
    mainProgramLines.push(line);
    i++;
  }

  function findIfParts(linesList, start) {
    let depth = 0;
    let elseIndex = -1;
    for (let n = start; n < linesList.length; n++) {
      const u = linesList[n].toUpperCase();
      if (u.startsWith("IF ") && u.endsWith("THEN")) depth++;
      else if (u.startsWith("ENDIF")) {
        depth--;
        if (depth === 0) return { elseIndex, endIndex: n };
      } else if (u.startsWith("ELSE") && depth === 1 && elseIndex === -1) {
        elseIndex = n;
      }
    }
    return { elseIndex, endIndex: -1 };
  }

  function executeRange(linesList, start, endExclusive) {
    let pc = start;
    while (pc < endExclusive) {
      const line = linesList[pc];
      const upper = line.toUpperCase();

      if (upper.startsWith("DECLARE ")) {
        const beforeColon = line.substring(8).split(":")[0];
        beforeColon.split(",").map(v => v.trim()).filter(Boolean).forEach(v => env[v] = 0);
        pc++;
        continue;
      }

      if (upper.startsWith("CALL ")) {
        const callStr = line.substring(5).trim();
        const match = callStr.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\((.*?)\)$/);
        if (match) {
          const subName = match[1];
          const rawArgs = splitOutputArguments(match[2]);
          const sub = subroutines[subName];
          if (sub) {
            sub.rawArgNames = rawArgs;
            const evalArgs = rawArgs.map(a => evaluateExpr(a, env, arrays, subroutines));
            executeSubroutine(sub, evalArgs, env, arrays, subroutines);
            log += `[CALL Executed] PROCEDURE ${subName}\n`;
          }
        }
        pc++;
        continue;
      }

      if (upper.startsWith("IF ")) {
        const parts = findIfParts(linesList, pc);
        const match = line.match(/^IF\s+(.*?)\s+THEN$/i);
        const condition = Boolean(evaluateExpr(match[1], env, arrays, subroutines));
        if (condition) {
          executeRange(linesList, pc + 1, parts.elseIndex >= 0 ? parts.elseIndex : parts.endIndex);
        } else if (parts.elseIndex >= 0) {
          executeRange(parts.elseIndex + 1, parts.endIndex);
        }
        pc = parts.endIndex + 1;
        continue;
      }

      if (upper.startsWith("OUTPUT ")) {
        const exprText = line.substring(7).trim();
        const pieces = splitOutputArguments(exprText);
        outputs.push(pieces.map(p => evaluateExpr(p, env, arrays, subroutines)).join(" "));
        pc++;
        continue;
      }

      if (line.includes("←")) {
        const [left, right] = line.split("←").map(s => s.trim());
        const value = evaluateExpr(right, env, arrays, subroutines);
        env[left] = value;
        log += `[Var Update] ${left} = ${value}\n`;
        pc++;
        continue;
      }

      pc++;
    }
  }

  try {
    executeRange(mainProgramLines, 0, mainProgramLines.length);
  } catch (error) {
    return { cancelled: false, error: error.message, log, output: outputs.join("\n") };
  }

  return { cancelled: false, log, output: outputs.join("\n") };
}

function splitOutputArguments(text) {
  const parts = [];
  let current = "";
  let bracketDepth = 0;
  let quote = null;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (quote) {
      current += ch;
      if (ch === quote && text[i - 1] !== "\\") quote = null;
      continue;
    }

    if (ch === '"' || ch === "'") {
      quote = ch;
      current += ch;
      continue;
    }

    if (ch === "[" || ch === "(") bracketDepth++;
    else if (ch === "]" || ch === ")") bracketDepth = Math.max(0, bracketDepth - 1);

    if (ch === "," && bracketDepth === 0) {
      if (current.trim()) parts.push(current.trim());
      current = "";
    } else {
      current += ch;
    }
  }

  if (current.trim()) parts.push(current.trim());
  return parts;
}

function runAndExecuteCode() {
  let codeRaw = document.getElementById("code").value;
  let t = tasks[currentIdx];
  let outEl = document.getElementById("output");
  
  if (!codeRaw.trim()) {
    outEl.className = "output-display error-text";
    outEl.textContent = "Error: Code field is empty.";
    showFeedback("❌ Please enter pseudocode before running.", false);
    return;
  }

  let upperCode = codeRaw.toUpperCase();
  let missing = t.need.filter(x => !upperCode.includes(x));
  if (missing.length > 0) {
    outEl.className = "output-display error-text";
    outEl.textContent = `SyntaxError: Missing required keyword(s): ${missing.join(", ")}`;
    showFeedback(`❌ Missing required keywords: <b>${missing.join(", ")}</b>`, false);
    return;
  }

  let indentCheck = checkMultiLevelIndentation(codeRaw);
  if (!indentCheck.valid) {
    outEl.className = "output-display error-text";
    outEl.textContent = `IndentationError (Line ${indentCheck.lineNum}): "${indentCheck.lineText}"\nExpected ${indentCheck.expectedSpaces} spaces, found ${indentCheck.actualSpaces}.`;
    showFeedback(`❌ <b>Indentation Error:</b> Line ${indentCheck.lineNum} requires ${indentCheck.expectedSpaces} spaces.`, false);
    return;
  }

  let result = executePseudocode(codeRaw);

  if (result.error) {
    outEl.className = "output-display error-text";
    outEl.textContent = `ExecutionError: ${result.error}`;
    showFeedback(`❌ <b>Execution Error:</b> ${result.error}`, false);
    return;
  }

  outEl.className = "output-display";
  outEl.textContent = result.log + "---------------------------------\n[OUTPUT]:\n" + result.output;

  if (!completedTasks.has(currentIdx)) {
    completedTasks.add(currentIdx);
    score += 100;
    document.getElementById("score").textContent = score;
  }
  showFeedback("✅ <b>Execution Successful!</b> Subroutines and CIE pseudocode syntax verified.", true);
}

function prevTask() {
  if (currentIdx > 0) {
    loadTask(currentIdx - 1);
  } else {
    loadTask(tasks.length - 1);
  }
}

function nextTask() {
  if (currentIdx < tasks.length - 1) {
    loadTask(currentIdx + 1);
  } else {
    loadTask(0);
  }
}

function showHint() {
  let fb = document.getElementById("feedback");
  fb.className = "feedback info";
  fb.innerHTML = "💡 " + tasks[currentIdx].hint;
}

function resetCode() {
  let t = tasks[currentIdx];
  let ta = document.getElementById("code");
  if (ta) ta.value = t.defaultCode || "";
  let outEl = document.getElementById("output");
  if (outEl) {
    outEl.className = "output-display";
    outEl.textContent = 'Press "Run & Execute" to validate subroutines and simulate execution...';
  }
  hideFeedback();
}

function showFeedback(msg, isSuccess) {
  let fb = document.getElementById("feedback");
  fb.className = "feedback " + (isSuccess ? "success" : "error");
  fb.innerHTML = msg;
}

function hideFeedback() {
  let fb = document.getElementById("feedback");
  if (fb) {
    fb.className = "feedback";
    fb.innerHTML = "";
  }
}

loadTask(0);
</script>
