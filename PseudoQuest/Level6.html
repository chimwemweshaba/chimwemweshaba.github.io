function insertIndent() {
  let ta = document.getElementById("code");
  if (!ta) return;
  let start = ta.selectionStart;
  let end = ta.selectionEnd;
  const spaces = "    ";
  ta.value = ta.value.substring(0, start) + spaces + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + spaces.length;
  ta.focus();
}

// 1. Multi-Level Indentation Engine
function checkMultiLevelIndentation(code) {
  const lines = code.split('\n');
  let currentDepth = 0;
  
  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const trimmed = rawLine.trim();
    if (!trimmed) continue;
    
    let upper = trimmed.toUpperCase();
    
    if (upper.startsWith("NEXT") || upper.startsWith("ENDIF") || upper.startsWith("ENDCASE") || upper.startsWith("ENDWHILE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    } else if (upper.startsWith("ELSE")) {
      currentDepth = Math.max(0, currentDepth - 1);
    }

    const expectedSpaces = currentDepth * 4;
    const actualSpaces = rawLine.search(/\S|$/);

    if (actualSpaces < expectedSpaces) {
      return {
        valid: false,
        lineNum: i + 1,
        lineText: trimmed,
        expectedSpaces: expectedSpaces,
        actualSpaces: actualSpaces
      };
    }

    if (upper.startsWith("FOR ") || upper.includes("THEN") || upper.startsWith("ELSE") || upper.startsWith("CASE ")) {
      currentDepth++;
    }
  }

  return { valid: true };
}

// 2. Safe Expression Evaluator
function evaluateExpr(expr, env) {
  let clean = expr.trim();
  let keys = Object.keys(env).sort((a,b) => b.length - a.length);
  keys.forEach(k => {
    let reg = new RegExp("\\b" + k + "\\b", "g");
    clean = clean.replace(reg, typeof env[k] === "string" ? `"${env[k]}"` : env[k]);
  });
  clean = clean.replace(/←/g, "=").replace(/=/g, "===").replace(/<===/g, "<=").replace(/>===/g, ">=");
  try {
    return Function(`"use strict"; return (${clean})`)();
  } catch (e) {
    return expr;
  }
}

// 3. Dynamic Pseudocode Execution Engine for FOR Loops
function executeDynamicFORPseudocode(code, taskInputs, terminalLogRef) {
  let lines = code.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let outputs = [];
  let env = {};
  let i = 0;
  let cancelled = false;

  function runBlock(stopKeywords) {
    while (i < lines.length && !cancelled) {
      let line = lines[i];
      let upper = line.toUpperCase();

      if (stopKeywords.some(k => upper.startsWith(k))) {
        return;
      }

      // Variable Assignment
      if (upper.includes("←") && !upper.startsWith("FOR ")) {
        let parts = line.split("←");
        let varName = parts[0].trim();
        let val = evaluateExpr(parts[1], env);
        env[varName] = val;
        i++;
        continue;
      }

      // Dynamic INPUT Prompting
      if (upper.startsWith("INPUT ")) {
        let varName = line.substring(6).trim();
        let defaultVal = (taskInputs && taskInputs[varName]) ? taskInputs[varName] : "10";
        let userVal = prompt(`[Program Input]\nEnter value for variable '${varName}':`, defaultVal);
        
        if (userVal === null) {
          cancelled = true;
          return;
        }

        let parsedVal = !isNaN(userVal) && userVal.trim() !== "" ? Number(userVal) : userVal;
        env[varName] = parsedVal;
        terminalLogRef.log += `[INPUT Prompt] ${varName} = ${JSON.stringify(parsedVal)}\n`;
        i++;
        continue;
      }

      // Count-Controlled FOR Loop Execution
      if (upper.startsWith("FOR ")) {
        let match = line.match(/FOR\s+([A-Za-z0-9_]+)\s*←\s*(.*?)\s+TO\s+(.*?)(?:\s+STEP\s+(.*?))?$/i);
        if (match) {
          let varName = match[1].trim();
          let startVal = Number(evaluateExpr(match[2], env));
          let endVal = Number(evaluateExpr(match[3], env));
          let stepVal = match[4] ? Number(evaluateExpr(match[4], env)) : 1;

          let loopBodyStartIdx = i + 1;
          let loopFunc = (stepVal > 0) ? (v => v <= endVal) : (v => v >= endVal);

          for (let currentVal = startVal; loopFunc(currentVal) && !cancelled; currentVal += stepVal) {
            env[varName] = currentVal;
            i = loopBodyStartIdx;
            runBlock(["NEXT"]);
          }

          if (i < lines.length && lines[i].toUpperCase().startsWith("NEXT")) {
            i++;
          }
        } else {
          i++;
        }
        continue;
      }

      // Output Handling
      if (upper.startsWith("OUTPUT ")) {
        let expr = line.substring(7);
        let parts = expr.split(",").map(p => evaluateExpr(p, env));
        outputs.push(parts.join(" "));
        i++;
        continue;
      }

      i++;
    }
  }

  runBlock([]);
  return { cancelled, result: outputs.join("\n") };
}

function runAndExecuteCode() {
  let codeRaw = document.getElementById("code").value;
  let t = tasks[currentIdx];
  let fb = document.getElementById("feedback");
  let outEl = document.getElementById("output");
  
  if (!codeRaw.trim()) {
    outEl.className = "output-display error-text";
    outEl.textContent = "Error: Code field is empty. Please enter pseudocode.";
    showFeedback("❌ Please enter pseudocode before running.", false);
    return;
  }

  // Syntax Keyword check
  let upperCode = codeRaw.toUpperCase();
  let missing = t.need.filter(x => !upperCode.includes(x));
  if (missing.length > 0) {
    outEl.className = "output-display error-text";
    outEl.textContent = `SyntaxError: Missing required keyword(s): ${missing.join(", ")}`;
    showFeedback(`❌ Missing required keywords: <b>${missing.join(", ")}</b>`, false);
    return;
  }

  // 4-Space Indentation Check
  let indentCheck = checkMultiLevelIndentation(codeRaw);
  if (!indentCheck.valid) {
    outEl.className = "output-display error-text";
    outEl.textContent = `IndentationError (Line ${indentCheck.lineNum}): "${indentCheck.lineText}"\nExpected ${indentCheck.expectedSpaces} spaces for level depth, but found ${indentCheck.actualSpaces}.`;
    showFeedback(`❌ <b>Indentation Error:</b> Line ${indentCheck.lineNum} requires ${indentCheck.expectedSpaces} spaces.`, false);
    return;
  }

  let terminalLogRef = { log: "Starting Execution...\n" };
  let execution = executeDynamicFORPseudocode(codeRaw, t.sampleInputs, terminalLogRef);

  if (execution.cancelled) {
    outEl.className = "output-display error-text";
    outEl.textContent = "Execution halted: Input prompt was cancelled by user.";
    hideFeedback();
    return;
  }

  terminalLogRef.log += `---------------------------------\n[OUTPUT]:\n${execution.result || "(No output produced)"}\n---------------------------------\nExecution finished with 0 errors.`;

  outEl.className = "output-display";
  outEl.textContent = terminalLogRef.log;

  score += 100;
  document.getElementById("score").textContent = score;
  showFeedback("✅ <b>Execution Successful!</b> Loop logic, dynamic prompts, and indentation verified.", true);
}

function prevTask() {
  if (currentIdx > 0) {
    loadTask(currentIdx - 1);
  } else {
    loadTask(tasks.length - 1);
  }
}

function nextTask() {
  if (currentIdx < tasks.length - 1) {
    loadTask(currentIdx + 1);
  } else {
    loadTask(0);
  }
}

function showHint() {
  let fb = document.getElementById("feedback");
  fb.className = "feedback info";
  fb.innerHTML = "💡 " + tasks[currentIdx].hint;
}

function resetCode() {
  let t = tasks[currentIdx];
  let ta = document.getElementById("code");
  if (ta) ta.value = t.defaultCode || "";
  let outEl = document.getElementById("output");
  if (outEl) {
    outEl.className = "output-display";
    outEl.textContent = 'Press "Run & Execute" to validate indentation and simulate FOR loop execution...';
  }
  hideFeedback();
}

function showFeedback(msg, isSuccess) {
  let fb = document.getElementById("feedback");
  fb.className = "feedback " + (isSuccess ? "success" : "error");
  fb.innerHTML = msg;
}

function hideFeedback() {
  let fb = document.getElementById("feedback");
  if (fb) {
    fb.className = "feedback";
    fb.innerHTML = "";
  }
}

loadTask(0);
</script>
