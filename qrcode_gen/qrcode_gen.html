<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Self‑Hosted QR Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; }
    label { display: block; margin-bottom: 0.5rem; }
    input, textarea { width: 100%; padding: 0.5rem; margin-bottom: 1rem; }
    #qrcode { margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <label for="text">Text / URL</label>
  <textarea id="text" rows="3" placeholder="Type text or a link here"></textarea>
  <button id="generate">Generate QR</button>

  <div id="qrcode"></div>

  <!-- Minimal QR library (qrcodejs) -->
  <script>
    /*! qrcode.js (simplified embed) */
    // Source: https://github.com/davidshimjs/qrcodejs (MIT)
    // For brevity, include the minified file directly or via <script src="qrcode.min.js"></script>
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const btn = document.getElementById('generate');
    const text = document.getElementById('text');
    const container = document.getElementById('qrcode');
    let qr;

    btn.addEventListener('click', () => {
      const value = text.value.trim();
      if (!value) return;
      container.innerHTML = '';
      qr = new QRCode(container, {
        text: value,
        width: 256,
        height: 256,
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  </script>
</body>
</html>
